name: "Quality Zero Platform CodeQL Config"

# Fleet CODEQL DECISION: security-extended + security-and-quality (together
# they strictly subsume the default suite AND the extended suite). No custom
# packs. This mirrors the `queries:` input every fleet consumer of
# reusable-codeql.yml now gets.
queries:
  - uses: security-extended
  - uses: security-and-quality

# Reviewed suppressions live in ``query-filters``; each one has an
# ``**Excluded...**`` decision row under "## Query configuration
# decisions" in docs/CODE-SCANNING-DISMISSALS.md (checked by
# scripts/quality/check_dismissal_log.py). The two py/clear-text
# filters that used to live here were removed after a full analysis
# without them (run 40138157571) fired nothing: see that doc.
query-filters:
  # Reviewed sink: scripts/beads-fetch-pr-comments.ts writes its PR-comment
  # fetch to OUTPUT_PATH — a fixed local artifact path (constant default or
  # --output flag) — as inert JSON.stringify output; the untrusted comment
  # content can influence neither the path nor execution. The inline
  # suppression comment did not register with the analyzer, so the exclusion
  # lives here with the repo's other reviewed suppressions.
  - exclude:
      id: js/http-to-file-access
