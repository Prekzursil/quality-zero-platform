version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    pip-root-patch-minor:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - patch
      - minor
    pip-root-security:
      applies-to: security-updates
      patterns:
      - '*'
  labels:
  - dependencies
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions-root-patch-minor:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - patch
      - minor
    github-actions-root-security:
      applies-to: security-updates
      patterns:
      - '*'
  labels:
  - dependencies
