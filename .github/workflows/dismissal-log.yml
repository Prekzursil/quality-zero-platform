name: Dismissal Log

# The dismissal log's review-by dates are CI triggers: a dismissal whose
# justification can expire fails the check from the day after its date. A
# date passes without a commit, so this runs the validator every day too.
# Three red runs in a row open an alert:workflow-failing issue
# (scheduled-alerts.yml).

permissions: {}

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

jobs:
  check:
    name: Dismissal log is valid and nothing is overdue
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the validator's one dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Check the dismissal log
        env:
          QZ_REPO: ${{ github.repository }}
        run: python scripts/quality/check_dismissal_log.py --repo "$QZ_REPO"
