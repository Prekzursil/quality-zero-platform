name: Drift Sync Wave

# QZP v2 Phase 3 §4 first-wave dispatcher. Loops every repo in
# ``inventory/repos.yml`` and calls ``reusable-drift-sync.yml``
# against each. Dry-run by default — flipping to ``false`` requires
# both a manual dispatch AND the DRIFT_SYNC_PAT secret so the fleet
# can never be mass-modified by a scheduled cron by accident.

permissions: {}

# checkov:skip=CKV_GHA_7:operator-dispatched fleet sweep; inputs are control-plane params (dry-run flag, slug filter), not build-output mutators
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        required: false
        default: true
        description: "When true, per-repo drift-sync reports drift but opens no PRs."
      slug_filter:
        type: string
        required: false
        default: ""
        description: "Optional substring filter — only repos whose slug contains this run."

concurrency:
  group: drift-sync-wave
  cancel-in-progress: false

jobs:
  resolve-fleet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slugs: ${{ steps.plan.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install platform dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Enumerate governed repos
        id: plan
        env:
          QZ_SLUG_FILTER: ${{ inputs.slug_filter }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          inventory = yaml.safe_load(
              Path("inventory/repos.yml").read_text(encoding="utf-8"),
          ) or {}
          repos = inventory.get("repos", [])
          slug_filter = os.environ.get("QZ_SLUG_FILTER", "").strip()
          entries = []
          for entry in repos:
              if not isinstance(entry, dict):
                  continue
              slug = str(entry.get("slug", "")).strip()
              if not slug:
                  continue
              if slug_filter and slug_filter not in slug:
                  continue
              # Repos whose default branch is not 'main' carry it in the
              # inventory; the reusable's caller must pass it or its checkout
              # fetches a branch that does not exist (grace-iberlef-2026 is
              # master-defaulted and failed exactly this way, wave run
              # 44341494931: git fetch 'refs/heads/main*' -> exit 1).
              branch = str(entry.get("default_branch", "main") or "main").strip()
              entries.append({"slug": slug, "default_branch": branch})
          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as fh:
                  fh.write(f"slugs={json.dumps(entries)}\n")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Drift Sync Wave — fleet resolution\n\n")
                  fh.write(f"- Total repos in inventory: {len(repos)}\n")
                  fh.write(f"- Selected after filter: {len(entries)}\n")
                  for entry in entries:
                      fh.write(f"  - `{slug}`\n")
          PY

  sync:
    needs: resolve-fleet
    if: ${{ needs.resolve-fleet.outputs.slugs != '[]' && needs.resolve-fleet.outputs.slugs != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve-fleet.outputs.slugs) }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-drift-sync.yml # zizmor: ignore[self-repository]
    with:
      repo_slug: ${{ matrix.slug }}
      # The inventory records non-main default branches (grace-iberlef-2026
      # is master-defaulted); without this the reusable's checkout fetched
      # refs/heads/main* on a master-only repo and failed (run 44341494931).
      default_branch: ${{ matrix.default_branch }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      DRIFT_SYNC_PAT: ${{ secrets.DRIFT_SYNC_PAT }}
