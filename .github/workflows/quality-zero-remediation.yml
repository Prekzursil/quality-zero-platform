name: Quality Zero Remediation

permissions: {}

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- trusted private runner remediation only responds to internal gate failures.
    workflows: ["Quality Zero Gate"]
    types: [completed]
  workflow_dispatch:

jobs:
  require-codex-auth:
    # Disabled since 2026-10, and CODEX_AUTH_JSON is being removed from this
    # repository. Re-enabled without recreating that secret, this workflow
    # must fail HERE, visibly, not deep inside a Codex run or a runner queue.
    name: Require CODEX_AUTH_JSON
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CODEX_AUTH_PRESENT: ${{ secrets.CODEX_AUTH_JSON != '' }}
    steps:
      - name: Fail when CODEX_AUTH_JSON is not configured
        if: ${{ env.CODEX_AUTH_PRESENT != 'true' }}
        run: |
          echo "::error title=CODEX_AUTH_JSON not configured::This workflow needs the CODEX_AUTH_JSON Actions secret, which this repository no longer has. Recreate it before re-enabling the workflow."
          exit 1

  shared-remediation-loop:
    needs: require-codex-auth
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    uses: ./.github/workflows/reusable-remediation-loop.yml # zizmor: ignore[self-repository]
    with:
      repo_slug: Prekzursil/quality-zero-platform
      failure_context: Quality Zero Gate
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      platform_repository: ${{ github.repository }}
      platform_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
