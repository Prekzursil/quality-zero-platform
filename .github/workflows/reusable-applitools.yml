name: Reusable Applitools Visual Regression

permissions: {}

on:
  workflow_call:
    inputs:
      repo_slug:
        type: string
        required: true
      eyes_config_path:
        type: string
        required: false
        default: "applitools.config.js"
      batch_name:
        type: string
        required: false
        default: ""
      working_directory:
        type: string
        required: false
        default: "."
      platform_repository:
        type: string
        required: false
        default: Prekzursil/quality-zero-platform
        description: "Deprecated and ignored. The platform is checked out at this workflow file's own commit (job.workflow_repository / job.workflow_sha), so a caller can no longer pick, or drift from, the scripts it runs. Still declared so existing callers that pass it keep working."
      platform_ref:
        type: string
        required: false
        default: main
        description: "Deprecated and ignored. The platform is checked out at this workflow file's own commit (job.workflow_repository / job.workflow_sha), so a caller can no longer pick, or drift from, the scripts it runs. Still declared so existing callers that pass it keep working."
    secrets:
      APPLITOOLS_API_KEY:
        required: true

jobs:
  applitools:
    name: Applitools Visual
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the platform at this workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: platform
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install platform dependencies
        run: python -m pip install -r platform/requirements-dev.txt

      - name: Validate eyes_config_path (§B.2.2)
        # Semgrep ``run-shell-injection``: route ``github.*`` and ``inputs.*``
        # values through ``env:`` instead of interpolating them into the
        # ``run:`` script directly. Keeps a malicious workflow input
        # (``eyes_config_path``) from breaking out of the argument slot into
        # arbitrary shell.
        env:
          REPO_ROOT: ${{ github.workspace }}
          EYES_CONFIG_PATH: ${{ inputs.eyes_config_path }}
        run: |
          python platform/scripts/quality/rollup_v2/validate_workflow_paths.py \
            --repo-root "$REPO_ROOT" \
            --path "$EYES_CONFIG_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          # No implicit npm cache: deterministic installs, nothing a PR run can seed.
          package-manager-cache: false

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Run Applitools Eyes
        # Route ``inputs.eyes_config_path`` through env for the same reason
        # as the validation step above (Semgrep ``run-shell-injection``).
        working-directory: ${{ inputs.working_directory }}
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_BATCH_NAME: ${{ inputs.batch_name != '' && inputs.batch_name || format('PR {0}', github.event.pull_request.number) }}
          EYES_CONFIG_PATH: ${{ inputs.eyes_config_path }}
        run: |
          npx @applitools/eyes-storybook --conf "$EYES_CONFIG_PATH" \
            --exitcode || true

      - name: Upload Applitools artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: applitools-artifacts
          path: |
            ${{ inputs.working_directory }}/applitools-results.json
