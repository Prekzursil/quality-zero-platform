name: Reusable Chromatic Visual Regression

permissions: {}

on:
  workflow_call:
    inputs:
      repo_slug:
        type: string
        required: true
      storybook_build_script:
        type: string
        required: false
        default: "npm run build-storybook"
      storybook_dir:
        type: string
        required: false
        default: "storybook-static"
      working_directory:
        type: string
        required: false
        default: "."
      platform_repository:
        type: string
        required: false
        default: Prekzursil/quality-zero-platform
        description: "Deprecated and ignored. The platform is checked out at this workflow file's own commit (job.workflow_repository / job.workflow_sha), so a caller can no longer pick, or drift from, the scripts it runs. Still declared so existing callers that pass it keep working."
      platform_ref:
        type: string
        required: false
        default: main
        description: "Deprecated and ignored. The platform is checked out at this workflow file's own commit (job.workflow_repository / job.workflow_sha), so a caller can no longer pick, or drift from, the scripts it runs. Still declared so existing callers that pass it keep working."
    secrets:
      CHROMATIC_PROJECT_TOKEN:
        required: true

jobs:
  chromatic:
    name: Chromatic Playwright
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the platform at this workflow's own commit
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: platform
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install platform dependencies
        run: python -m pip install -r platform/requirements-dev.txt

      - name: Validate storybook_dir path (§B.2.2)
        # Semgrep ``run-shell-injection``: route ``github.*`` and ``inputs.*``
        # into env vars instead of interpolating into ``run:`` directly.
        env:
          REPO_ROOT: ${{ github.workspace }}
          STORYBOOK_DIR: ${{ inputs.storybook_dir }}
        run: |
          python platform/scripts/quality/rollup_v2/validate_workflow_paths.py \
            --repo-root "$REPO_ROOT" \
            --path "$STORYBOOK_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@1cfa065cbdab28f6ca3afaeb3d761383076a35aa  # v11 — pinned per §A.2.4
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: ${{ inputs.storybook_build_script }}
          storybookBuildDir: ${{ inputs.storybook_dir }}
          workingDir: ${{ inputs.working_directory }}
          exitZeroOnChanges: true
          exitOnceUploaded: true

      - name: Upload Chromatic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-artifacts
          path: |
            ${{ inputs.working_directory }}/${{ inputs.storybook_dir }}
