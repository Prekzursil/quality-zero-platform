name: Reusable CodeQL

permissions: {}

on:
  workflow_call:
    inputs:
      repo_slug:
        type: string
        required: true
      event_name:
        type: string
        required: false
        default: pull_request
      sha:
        type: string
        required: false
        default: ""
      platform_repository:
        type: string
        required: false
        default: Prekzursil/quality-zero-platform
      platform_ref:
        type: string
        required: false
        default: main
      codeql_config_file:
        type: string
        required: false
        default: ""
        description: |
          Optional path (relative to the consumer-repo checkout root)
          to a CodeQL config YAML. Empty string = no config file is
          passed to ``github/codeql-action/init``. Platform-internal
          callers pass ``./.github/codeql/codeql-config.yml`` to wire
          the false-positive suppressions for ``secrets_sync.py``;
          fleet consumers leave this empty.

jobs:
  resolve-profile:
    name: Resolve CodeQL Profile
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.codeql_enabled }}
      state: ${{ steps.plan.outputs.codeql_state }}
      runner: ${{ steps.plan.outputs.codeql_runner }}
      languages_csv: ${{ steps.plan.outputs.codeql_languages_csv }}
      build_mode: ${{ steps.plan.outputs.codeql_build_mode }}
      go_version: ${{ steps.plan.outputs.codeql_go_version }}
      java_distribution: ${{ steps.plan.outputs.codeql_java_distribution }}
      java_version: ${{ steps.plan.outputs.codeql_java_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.platform_repository }}
          ref: ${{ inputs.platform_ref }}
          path: platform
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install platform dependencies
        run: python -m pip install -r platform/requirements-dev.txt
      - name: Export resolved profile
        env:
          REPO_SLUG: ${{ inputs.repo_slug }}
          EVENT_NAME: ${{ inputs.event_name }}
        run: |
          python platform/scripts/quality/export_profile.py \
            --repo-slug "$REPO_SLUG" \
            --event-name "$EVENT_NAME" \
            --out-json "$RUNNER_TEMP/profile.json"
      # codeql_state is what the fail-closed gate below decides on:
      #   opt-out      - the profile sets codeql.enabled: false (the ONLY pass
      #                  without an analysis)
      #   enabled      - languages declared; the analysis must succeed
      #   no-languages - enabled (explicitly or by default) but nothing to
      #                  analyse: a broken profile, never an opt-out
      - name: Plan CodeQL execution
        id: plan
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = json.loads((Path(os.environ["RUNNER_TEMP"]) / "profile.json").read_text(encoding="utf-8"))
          codeql = profile.get("codeql", {})
          setup = codeql.get("setup", {})
          languages = [item for item in codeql.get("languages", []) if item]
          if codeql.get("enabled", True) is False:
              state = "opt-out"
          elif languages:
              state = "enabled"
          else:
              state = "no-languages"
          enabled = state == "enabled"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"codeql_state={state}\n")
              handle.write(f"codeql_enabled={'true' if enabled else 'false'}\n")
              handle.write(f"codeql_runner={codeql.get('runner', 'ubuntu-latest')}\n")
              handle.write(f"codeql_languages_csv={','.join(languages)}\n")
              handle.write(f"codeql_build_mode={codeql.get('build_mode', 'none')}\n")
              handle.write(f"codeql_go_version={setup.get('go', '')}\n")
              java = setup.get('java', {})
              handle.write(f"codeql_java_distribution={java.get('distribution', '')}\n")
              handle.write(f"codeql_java_version={java.get('version', '')}\n")
          PY

  # The analysis itself. Its job id stays `codeql` (the code-scanning analysis
  # key, so existing alerts keep their identity); only its display name moved,
  # because the check name `<caller> / CodeQL` now belongs to the fail-closed
  # gate below.
  codeql:
    name: CodeQL analyze
    needs: resolve-profile
    if: ${{ needs.resolve-profile.outputs.enabled == 'true' }}
    runs-on: ${{ needs.resolve-profile.outputs.runner }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha != '' && inputs.sha || github.sha }}

      - name: Set up Go
        if: ${{ needs.resolve-profile.outputs.go_version != '' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ needs.resolve-profile.outputs.go_version }}

      - name: Set up Java
        if: ${{ needs.resolve-profile.outputs.java_version != '' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: ${{ needs.resolve-profile.outputs.java_distribution }}
          java-version: ${{ needs.resolve-profile.outputs.java_version }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ needs.resolve-profile.outputs.languages_csv }}
          build-mode: ${{ needs.resolve-profile.outputs.build_mode }}
          # Config file is OPTIONAL — defaults to empty so consumer
          # fleet repos (which don't ship the platform-internal
          # ``codeql-config.yml``) don't error at init. The platform's
          # own ``codeql.yml`` caller passes ``./.github/codeql/codeql-config.yml``
          # to wire the false-positive suppressions for ``secrets_sync.py``.
          config-file: ${{ inputs.codeql_config_file }}
          queries: security-and-quality

      - name: Autobuild
        if: ${{ needs.resolve-profile.outputs.build_mode == 'autobuild' }}
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  # ── Fail-closed gate: the check fleet branch protection requires ──────────
  # `codeql / CodeQL` used to be the analysis job itself, guarded by
  # `if: enabled == 'true'`. When resolve-profile FAILED (a bad platform merge,
  # an offboarded slug, a PyPI outage) or produced no languages, that job was
  # SKIPPED, and GitHub counts a skipped required check as passing: CodeQL
  # gating silently switched itself off. This job always runs and decides:
  #   resolve-profile did not succeed       -> FAIL (nothing was analysed)
  #   profile sets codeql.enabled: false    -> PASS, saying so in the log
  #   enabled but no languages declared     -> FAIL (a broken profile is not
  #                                            an opt-out)
  #   analysis did not succeed              -> FAIL
  codeql-gate:
    name: CodeQL
    needs: [resolve-profile, codeql]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a completed CodeQL analysis or a declared opt-out
        shell: bash
        env:
          RESOLVE_RESULT: ${{ needs.resolve-profile.result }}
          CODEQL_STATE: ${{ needs.resolve-profile.outputs.state }}
          ANALYZE_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          if [ "$RESOLVE_RESULT" != "success" ]; then
            echo "::error title=CodeQL gate::The CodeQL profile could not be resolved (resolve-profile: $RESOLVE_RESULT), so nothing was analysed. A skipped analysis must not satisfy the required check."
            exit 1
          fi
          case "$CODEQL_STATE" in
            opt-out)
              echo "::notice title=CodeQL gate::This repository's quality-zero-platform profile sets codeql.enabled: false, so there is nothing to analyse."
              exit 0
              ;;
            enabled) ;;
            no-languages)
              echo "::error title=CodeQL gate::This repository's quality-zero-platform profile enables CodeQL but declares no codeql.languages, so nothing was analysed. Declare the languages, or set codeql.enabled: false to opt out."
              exit 1
              ;;
            *)
              echo "::error title=CodeQL gate::Unknown CodeQL plan state '$CODEQL_STATE' from resolve-profile; refusing to pass without an analysis."
              exit 1
              ;;
          esac
          if [ "$ANALYZE_RESULT" != "success" ]; then
            echo "::error title=CodeQL gate::The CodeQL analysis did not succeed (CodeQL analyze: $ANALYZE_RESULT)."
            exit 1
          fi
          echo "CodeQL analysis completed."
