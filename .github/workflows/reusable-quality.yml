# Lean 6-gate quality template (workflow_call reusable workflow).
#
# This is the ADDITIVE thin template adopted by the lean-gate charter
# (decided 2026-06-16). It is the multi-language generalization of the PROVEN
# lean gate running in Prekzursil/Reframe (.github/workflows/quality.yml) — same
# tool pins, same single-job binary green/red model.
#
# It is the fleet's quality gate: every governed repo with a quality.yml calls
# it. The legacy SaaS reusable workflows remain only for callers that have not
# migrated yet.
#
# ── Adoption (≈5 lines in the caller repo) ──────────────────────────────────
#   # .github/workflows/quality.yml in the CALLER repo
#   name: quality
#   on:
#     push: { branches: [main] }
#     pull_request: { branches: [main] }
#   permissions: { contents: read }
#   jobs:
#     quality:
#       # Pin a FULL commit SHA: a branch or tag ref lets a push to this repo
#       # change the gate for every caller at once.
#       uses: Prekzursil/quality-zero-platform/.github/workflows/reusable-quality.yml@<40-hex-sha>
#
# ── The closed 6-gate charter this workflow enforces ────────────────────────
#   1. Lint+format (SELF-CONTAINED — the workflow's OWN pinned CLIs, NOT the
#      caller's pre-commit): Ruff[py] · Oxlint+Biome[ts/js]
#   2. Types:        tsc --noEmit[ts] · basedpyright (standard mode)[py]
#   3. Tests+cov:    STRICT 100% line+branch (standing policy; ratchet retired),
#                    ASSERTED by this workflow for py/jsts, and measured for
#                    go/c++ via the caller's own coverage gate
#   4. SAST:         Opengrep (Semgrep CE acceptable) — ALWAYS runs: the
#                    caller's .quality/opengrep ruleset when present, else the
#                    platform's curated default ruleset embedded below
#   5. Secrets:      gitleaks (pinned) — SELF-CONTAINED, ALWAYS runs; a caller
#                    .gitleaks.toml is an optional allowlist, NOT the trigger
#   6. Deps:         osv-scanner + Dependabot (no Renovate) — runs whenever a
#                    manifest or lockfile exists; osv-scanner.toml is optional.
#                    Blocking policy per the `deps-severity-floor` input:
#                    `t0` (default, the severity floor below) or `any` (zero
#                    tolerance: every finding blocks)
#
# ── gate-6 T0 SEVERITY FLOOR (2026-08-11) ───────────────────────────────────
# `osv-scanner` exits 1 for ANY advisory match, with no severity, dev/prod or
# fix-availability signal. Mapping that straight onto a red branch is what left
# 22 of 34 open fleet PRs BLOCKED on 2026-08-11 — including DevExtreme PR #40,
# itself a security bump, stuck 17 days behind an UNSCORED Go stdlib advisory
# (`max_severity: ""`) that nothing in that PR could clear. The escape valve was
# saturated too: momentstudio had already ignored GHSA-mh99-v99m-4gvg and then
# failed on GHSA-rgw5-rvv9-x895, a DIFFERENT advisory in the SAME package.
#
# Pinning a TOOL does not pin its DATA: a CVE feed refreshes upstream, so gate 6
# could go red with zero developer action. That is the treadmill the lean charter
# exists to escape, reproduced inside the lean gate itself.
#
# So gate 6 now tiers its findings (exit codes 0/127/128/129/130 are UNCHANGED —
# only the rc==1 branch is re-decided):
#   T0 BLOCK  — NOT dev-only AND CVSS >= 7.0 AND a fixed version is published.
#               Every blocking row names the version to bump to, so every block
#               is closable by an action the owner controls.
#   T2 REPORT — dev-only, unscored, below the floor, or no published fix.
#               PRINTED IN FULL and non-blocking. Demoted is not hidden.
# Measured on real data: momentstudio's frontend lockfile has 29 finding-groups
# and exactly 4 clear T0 (@angular/common 8.8, platform-server 8.6, compiler 7.6,
# core 7.6 — all production, all fixable); a `go 1.25.11` go.mod has 2 and blocks
# on neither. Both are committed as fixtures under tests/fixtures/osv/.
#
# round-6 FIX (self-contained gate 1+5): gate-1 lint/format and gate-5 secrets
# NO LONGER run the caller's `.pre-commit-config.yaml` via `pre-commit run
# --all-files`. That depended on each repo's BESPOKE hooks + environment (a root
# npm lockfile for npm ci, the .NET SDK for dotnet-format, caller-local
# eslint/tsc/prettier, ...), so it red-failed for CALLER-ENVIRONMENT reasons even
# when the repo's REAL lean quality was fine. Instead the workflow now runs the
# lean charter's OWN tools directly: ruff check + ruff format --check for Python
# (honoring a caller [tool.ruff] / ruff.toml when present), and gitleaks for
# secrets (honoring a caller .gitleaks.toml allowlist). oxlint + biome for ts/js
# were ALREADY self-contained (gate-lint-format-jsts) and are unchanged. This is
# NOT weakening: the SAME lean charter tools still gate (ruff issues + gitleaks
# findings still FAIL) — they just no longer drag in the caller's pre-commit env.
#
# Auto-detection: the single `quality` job inspects the CALLER's checked-out
# tree and runs ONLY the lanes whose language is present. A repo with no Python
# skips the Python lanes, a repo with no JS/TS skips tsc, etc. The lint lanes run
# whenever their language is present. The SAST, secrets and deps gates are NOT
# keyed on caller config any more: a config file is an optional INPUT to each
# scan, never the switch that turns the scan on. GITLEAKS went first (round-7):
# its trigger used to be "a .gitleaks.toml exists", but that file is an
# ALLOWLIST, so the presence of things we decided to IGNORE was the opt-in signal
# for secret scanning and a clean repo got none at all. round-10 closes the same
# inverted trigger on the other two: gate 4 used to run only when
# `.quality/opengrep` existed and gate 6 only when `osv-scanner.toml` existed,
# so a caller that had never written either got NO SAST and NO dependency scan
# while `quality` still reported green (measured 2026-10-24: SWFOC-Mod-Menu,
# pbinfo-get-unsolved and fractal-darkroom had no SAST; fractal-darkroom and
# Personal-Finance-Management had no dependency gate).
#
# No silent-pass: the coverage lane (gate 3) NEVER passes a language green
# without measuring it. If a language has source AND test files but no coverage
# config/script, the lane FAILS (the 100% gate cannot pass unmeasured). This now
# covers Python, JS/TS, Go and C++ — see the round-7 note below for the two
# compiled languages that were silently exempt. The ONLY
# coverage skip is the narrow, documented "no test surface by design" case —
# source present with ZERO test files (e.g. a pure type-stub or generated-only
# package). Robustness: the pip cache is enabled only when a Python manifest is
# resolvable; osv-scanner treats "no manifests/lockfiles" as PASS (not exit-128);
# tsc runs per-tsconfig so nested/monorepo projects are checked, not hard-failed.
# Gate 3 installs the CALLER's Python runtime deps (requirements*/pyproject/
# setup.*) before pytest so tests importing a runtime dep don't ModuleNotFoundError,
# and runs `npm ci` before any node coverage. Gate 1's lint/format runs the
# workflow's OWN pinned CLIs SELF-CONTAINED (ruff[py], oxlint+biome[ts/js]), so a
# caller-local frontend-eslint / dotnet-format / etc. pre-commit hook cannot abort
# the lean gate — the caller's `.pre-commit-config.yaml` is no longer executed.
#
# round-5 FIX A (basedpyright standard): basedpyright's DEFAULT mode is stricter
# than pyright (reportAny/reportUnknown*/reportUnusedCallResult), flooding untyped
# utility scripts with thousands of non-bug errors (momentstudio 2774, swfoc 39,
# pbinfo 11). Reframe runs it at typeCheckingMode = "standard". So gate-2 now
# HONORS a caller basedpyright/pyright config (pyrightconfig.json /
# basedpyrightconfig.json / pyproject [tool.(based)pyright]) when present, else
# passes `--typecheckingmode standard`. Real type errors at standard still FAIL.
#
# round-5 FIX B (per-language toolchain setup) — RETIRED in round-6: those setups
# (setup-go / setup-dotnet / setup-java / rust-toolchain) existed ONLY so the
# caller pre-commit's per-language autofixers (golangci-lint / dotnet-format /
# spotless / clippy+rustfmt) had a toolchain. round-6 stopped running the caller
# pre-commit, and NO remaining gate step invokes go/.NET/java/rust, so those four
# toolchain setups were dropped as dead weight. Only Python and Node are set up —
# they back gate-2 (basedpyright / tsc), gate-3 (coverage) and the self-contained
# gate-1 lint/format (ruff / oxlint+biome). Each runs ONLY when its language is
# detected; all actions are SHA-pinned.
#
# ── round-7 FIX (compiled-language coverage REGRESSION) ─────────────────────
# round-6's reasoning above is sound for LINT, and this round does not walk any
# of it back: no per-language autofixer returns. But dropping the caller
# pre-commit AND the toolchains together also removed the only path by which a
# compiled language reached GATE 3, and nothing replaced it. Both Go and C++ then
# fell through to the narrow "no test surface by design" skip while the step
# reported success. Measured on the live fleet 2026-08-11:
#   * DevExtreme-Filter-Go-Language — 236,928 bytes of Go, 30+ *_test.go files,
#     and a pre-commit hook `go-test-cover-100` = `bash scripts/coverage-gate.sh`
#     whose own config header still names THIS workflow as its CI entrypoint.
#     Coverage was never measured and the gate was green anyway.
#   * Airline-Reservations-System — 166,743 bytes of C/C++ across 32 files
#     (.cpp/.cc/.hpp/.h; 32.6% of source bytes, 9.0% of all blob bytes)
#     and 11 *_test.cpp files under tests/, with no lane at all. Second-
#     largest language there after Python (239,129 B), none of it measured.
# So round-7 restores setup-go (gate 3 ONLY, pinned by the caller's own go.mod)
# and adds `gate-tests-coverage compiled (go / c++)`, which runs the CALLER's own
# coverage gate — by default `scripts/coverage-gate.sh`, the exact command
# DevExtreme's own pre-commit hook already runs, overridable with the
# `coverage-gate-script` input. With test files present that lane cannot skip.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python toolchain version for the Python lanes."
        type: string
        required: false
        default: "3.12"
      node-version:
        description: >-
          Node toolchain version for the JS/TS lanes. Default 24: Node 20 reached
          end of life on 2026-04-30 and Node 22 is maintenance-only until its
          own end of life on 2027-04-30.
        type: string
        required: false
        default: "24"
      opengrep-paths:
        description: "Space-separated paths the SAST gate scans (default: repo root '.')."
        type: string
        required: false
        default: "."
      jsts-coverage-min:
        description: >-
          Required JS/TS line AND branch coverage percentage, asserted by gate 3
          against the summary the caller's coverage script actually produced.
          Must be in (0, 100]; the default is the charter's STRICT 100. Lowering
          it declares an interim bar VISIBLY, in the caller's own workflow file,
          and it can never restore a silent pass: a run that produces no
          parseable coverage summary fails at any setting.
        type: number
        required: false
        default: 100
      coverage-gate-script:
        description: >-
          Repo-relative path to the caller's OWN test+coverage gate script, used
          by gate 3 for compiled languages (Go / C++) whose coverage cannot be
          measured generically. Default is the fleet convention already in use
          by DevExtreme-Filter-Go-Language, whose pre-commit `go-test-cover-100`
          hook runs exactly `bash scripts/coverage-gate.sh`.
        type: string
        required: false
        default: "scripts/coverage-gate.sh"
      deps-severity-floor:
        description: >-
          Gate 6 blocking policy. "t0" (default) blocks only a production
          dependency whose advisory is CVSS >= 7.0 AND has a published fix;
          everything else osv-scanner reports is printed as T2 inventory and
          does not block. "any" is ZERO TOLERANCE: every finding blocks,
          including dev-only, unscored, below-floor and not-yet-fixable ones,
          and the same classified table is printed so a reader can see which
          rows "t0" would have demoted. Any other value fails the job before a
          single gate runs, never a silent fall-back to "t0".
        type: string
        required: false
        default: "t0"

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    # A wedged test run must not hold a runner for the 6-hour platform default.
    timeout-minutes: 60
    steps:
      # Inputs are validated FIRST, before any tool is installed or any gate
      # runs: a typo'd policy must fail loudly, not quietly gate on a default.
      - name: Validate workflow inputs
        shell: bash
        env:
          DEPS_SEVERITY_FLOOR: ${{ inputs.deps-severity-floor }}
        run: |
          set -euo pipefail
          case "$DEPS_SEVERITY_FLOOR" in
            t0|any)
              echo "deps-severity-floor: $DEPS_SEVERITY_FLOOR"
              ;;
            *)
              echo "::error title=invalid deps-severity-floor::deps-severity-floor must be 't0' or 'any'."
              printf 'FAIL: unsupported deps-severity-floor value %q\n' "$DEPS_SEVERITY_FLOOR" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # ── Language detection ────────────────────────────────────────────────
      # Sets boolean outputs consumed by the per-lane `if:` guards below.
      - name: Detect languages present in caller
        id: detect
        shell: bash
        run: |
          set -eu
          # SIGPIPE-SAFE detection (round-3 FIX 2): the detection helpers pipe
          # `git ls-files ... | head -1`; `head` closes the pipe after the first
          # line, so `git` (the writer) is killed with SIGPIPE and exits 141. Under
          # `set -o pipefail` that 141 becomes the pipeline's exit and aborts the
          # whole step (observed: event-link). Detection must NEVER hard-fail — it
          # only sets boolean outputs — so pipefail is DISABLED for this step. Each
          # helper already tolerates an empty result (treated as "absent"), and the
          # `2>/dev/null` keeps stderr quiet. We do NOT set pipefail here; a head-
          # closed-early SIGPIPE can therefore never red the gate before any lane runs.
          set +o pipefail
          has() { [ -n "$(git ls-files "$@" 2>/dev/null | head -1)" ] && echo true || echo false; }
          any() { [ -n "${1:-}" ] && echo true || echo false; }
          file_exists() { [ -f "$1" ] && echo true || echo false; }
          # A resolvable Python dependency manifest (used to gate the pip cache so
          # setup-python never hard-fails when there is nothing to cache).
          py_manifest="$(git ls-files \
            requirements.txt requirements*.txt '**/requirements.txt' '**/requirements*.txt' \
            pyproject.toml '**/pyproject.toml' setup.py '**/setup.py' \
            setup.cfg '**/setup.cfg' Pipfile '**/Pipfile' 2>/dev/null | head -1)"
          # ALL resolvable Python manifests, one per line — used verbatim as
          # setup-python's `cache-dependency-path` (round-3 FIX 3). actions/setup-
          # python's `cache: pip` default hash glob is ONLY `**/requirements.txt`
          # OR `**/pyproject.toml`; a repo whose only manifest is non-standard
          # (e.g. requirements-dev.txt / requirements/*.txt) matches NEITHER, so
          # setup-python hard-fails "No file matched to [**/requirements.txt or
          # **/pyproject.toml]" BEFORE any gate runs (observed: codeblocks). We
          # therefore feed it the ACTUAL detected manifest paths so the cache key
          # always has a real file to hash.
          py_manifest_paths="$(git ls-files \
            requirements.txt requirements*.txt '**/requirements.txt' '**/requirements*.txt' \
            'requirements/*.txt' '**/requirements/*.txt' \
            pyproject.toml '**/pyproject.toml' setup.py '**/setup.py' \
            setup.cfg '**/setup.cfg' Pipfile '**/Pipfile' 2>/dev/null | sort -u)"
          # A Python coverage configuration (pytest/coverage settings live here).
          py_cov_cfg="$(git ls-files pyproject.toml setup.cfg tox.ini '.coveragerc' 'pytest.ini' 2>/dev/null | head -1)"
          # round-5 FIX A — a basedpyright / pyright config supplied BY THE CALLER.
          # When present we honor it verbatim (run basedpyright as-is); when ABSENT
          # we pass `--typecheckingmode standard` so the type gate uses the proven
          # standard bar (mirroring Reframe's [tool.basedpyright] typeCheckingMode =
          # "standard") instead of basedpyright's STRICTER default, which floods
          # untyped utility scripts with reportAny/reportUnknown*/reportUnusedCallResult
          # (observed: momentstudio 2774, swfoc 39, pbinfo 11 — all from scripts/utils,
          # none real bugs). A pyproject.toml counts only if it actually carries a
          # `[tool.basedpyright]` or `[tool.pyright]` table.
          py_pyright_cfg="$(git ls-files pyrightconfig.json basedpyrightconfig.json 2>/dev/null | head -1)"
          if [ -z "$py_pyright_cfg" ] && [ -f pyproject.toml ] \
            && grep -Eq '^\[tool\.(based)?pyright\]' pyproject.toml 2>/dev/null; then
            py_pyright_cfg=pyproject.toml
          fi
          # round-5 FIX B — per-language toolchain detection (source OR manifest).
          # C#/.NET, Java/Kotlin, Rust and Go each need their toolchain set up
          # BEFORE the gate that runs their linter/formatter, else the lane hard-fails
          # (observed: codex-session — dotnet-format -> "Restore operation failed", no
          # .NET SDK). round-6 RETIRED those toolchains (the caller pre-commit that
          # used them no longer runs), so the go/rust/csharp/javakotlin/dotnet detect
          # outputs were dropped — no surviving gate step consumes them.
          # Test surface — if a language has source but ZERO test files, a missing
          # coverage config is "no test surface by design" (skip), not a hole (fail).
          py_tests="$(git ls-files 'test_*.py' '*_test.py' '**/test_*.py' '**/*_test.py' \
            'tests/**' '**/tests/**' conftest.py '**/conftest.py' 2>/dev/null | head -1)"
          # (JS/TS test files are attributed per project by the gate-3 planner,
          # jsts_projects.py, so there is no repo-wide JS/TS test glob here.)
          # COMPILED-LANGUAGE test surface (round-7). round-6 removed the ONLY
          # path by which Go / C++ reached gate 3, so both languages hit the
          # "no test surface by design" skip and the step reported success even
          # for a repo that is 93% Go with 30+ *_test.go files (DevExtreme).
          # `*_test.go` is the only Go test-file convention. For C++ there is no
          # single convention, so match the two shapes actually in the fleet:
          # a `_test`/`test_` filename anywhere, and any source under tests/ or
          # test/ (Airline-Reservations-System ships tests/<name>_test.cpp).
          go_tests="$(git ls-files '*_test.go' '**/*_test.go' 2>/dev/null | head -1)"
          cpp_tests="$(git ls-files \
            '*_test.cpp' '**/*_test.cpp' '*_test.cc' '**/*_test.cc' \
            '*_test.cxx' '**/*_test.cxx' '*_tests.cpp' '**/*_tests.cpp' \
            'test_*.cpp' '**/test_*.cpp' '*Test.cpp' '**/*Test.cpp' \
            'tests/**/*.cpp' 'test/**/*.cpp' 'tests/**/*.cc' 'test/**/*.cc' 2>/dev/null | head -1)"
          {
            echo "python=$(has '*.py')"
            echo "ts=$(has '*.ts' '*.tsx')"
            echo "jsts=$(has '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')"
            echo "pyrightcfg=$(any "$py_pyright_cfg")"
            # round-10: NOT a guard on gate 4. Like the gitleaks allowlist
            # below, this only tells the gate which ruleset to load; the scan
            # itself always runs (the platform default ruleset when absent).
            echo "opengrepcfg=$([ -d .quality/opengrep ] && echo true || echo false)"
            # NOT a guard on gate 5 (round-7): .gitleaks.toml is an ALLOWLIST,
            # so gating the SCAN on it made "things we decided to ignore" the
            # opt-in signal for secret scanning. This output now only tells the
            # gate whether to pass --config; the scan itself always runs.
            echo "gitleaksallowlist=$(file_exists .gitleaks.toml)"
            # round-10: NOT a guard on gate 6 either. It only decides whether
            # --config=osv-scanner.toml is passed. Whether there is anything to
            # scan is osv-scanner's own call (exit 128), never a glob list here.
            echo "osvconfig=$(file_exists osv-scanner.toml)"
            echo "charter=$([ -f .quality/charter.yml ] && echo true || echo false)"
            echo "pymanifest=$(any "$py_manifest")"
            echo "pycovcfg=$(any "$py_cov_cfg")"
            echo "pytests=$(any "$py_tests")"
            echo "go=$(has '*.go')"
            echo "gomod=$(file_exists go.mod)"
            echo "gotests=$(any "$go_tests")"
            echo "cpp=$(has '*.cpp' '*.cc' '*.cxx' '*.hpp' '*.hh' '*.hxx')"
            echo "cpptests=$(any "$cpp_tests")"
          } >> "$GITHUB_OUTPUT"
          # Multiline output (round-3 FIX 3): the newline-separated manifest paths
          # for setup-python's cache-dependency-path. Heredoc delimiter form is
          # required for multiline GITHUB_OUTPUT values.
          {
            echo "pymanifestpaths<<__QZT_EOF__"
            printf '%s\n' "$py_manifest_paths"
            echo "__QZT_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Detected:"; cat "$GITHUB_OUTPUT"

      # ── Toolchains (set up only what the caller needs) ────────────────────
      # Two variants so the pip cache is enabled ONLY when a resolvable manifest
      # exists. `cache: pip` with no requirements.txt/pyproject.toml/setup.cfg/etc
      # hard-fails setup-python ("No file matched ...") BEFORE any gate runs — the
      # observed fleet red on dep-less Python repos (codeblocks/devextreme/swfoc/
      # tanks). Cached path for manifest repos; plain path otherwise.
      #
      # round-3 FIX 3: even WITH a manifest, `cache: pip`'s DEFAULT hash glob is
      # only `**/requirements.txt` OR `**/pyproject.toml`. A repo whose sole
      # manifest is non-standard (requirements-dev.txt, requirements/*.txt) matches
      # neither and setup-python still hard-fails "No file matched ..." (observed:
      # codeblocks). We pass `cache-dependency-path` set to the ACTUAL detected
      # manifest paths so the cache key always hashes a real file. (Belt-and-braces:
      # the `if:` still requires pymanifest == 'true', so this only runs when at
      # least one manifest exists; setup-python cannot hard-fail before the gates.)
      - name: Set up Python (cached)
        if: steps.detect.outputs.python == 'true' && steps.detect.outputs.pymanifest == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ steps.detect.outputs.pymanifestpaths }}

      - name: Set up Python (no cache)
        if: steps.detect.outputs.python == 'true' && steps.detect.outputs.pymanifest == 'false'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Node
        if: steps.detect.outputs.jsts == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      # round-7: setup-go is RESTORED — but only for gate 3, never for a lint
      # autofixer. round-6's stated reason for dropping the per-language setups
      # was that they existed solely to feed the caller pre-commit's autofixers
      # (golangci-lint / dotnet-format / spotless / clippy+rustfmt), which
      # red-failed for caller-ENVIRONMENT reasons. That reasoning holds and is
      # preserved: no autofixer comes back here. What round-6 ALSO removed by
      # accident was the only way a Go coverage script could run at all, which
      # is why a 236,928-byte Go repo with 30+ *_test.go files was certified
      # green with zero measured coverage. Gate 3 needs a toolchain; gate 1
      # does not get one.
      #
      # `go-version-file: go.mod` pins the toolchain to the CALLER's own `go`
      # directive, so this adds no unpinned dependency. `cache: false` is
      # deliberate: setup-go's dependency cache hard-fails when it cannot
      # resolve go.sum, and a toolchain step that can red the job BEFORE any
      # gate runs is exactly the class of failure this workflow keeps fixing
      # (see the setup-python cached/no-cache split above).
      - name: Set up Go
        if: steps.detect.outputs.gomod == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # round-6: setup-dotnet / setup-java / rust-toolchain remain REMOVED.
      # They were added in round-5 FIX B solely so the caller pre-commit's
      # per-language autofixers (golangci-lint / dotnet-format / spotless /
      # clippy+rustfmt) had a toolchain. round-6 stopped running the caller
      # pre-commit and no remaining gate step invokes go/.NET/java/rust, so those
      # setups are dead weight. Python + Node (above) are the only toolchains the
      # surviving gates need (basedpyright/tsc/coverage + the self-contained ruff
      # and oxlint+biome lint/format lanes).

      # round-10 LANE ORDER: gate 2 (basedpyright) resolves every import
      # against THIS Python environment, and gate 3 runs the tests in it. The
      # caller's runtime deps used to be installed INSIDE gate 3, i.e. after
      # the type check, so gate 2 saw every third-party import as missing
      # (reportMissingImports is an error at the standard bar). They are now
      # installed once, here, before both - and BEFORE the pinned ruff and
      # basedpyright below, so a caller dependency that happens to pull one of
      # those tools can never replace the pinned version: the pins install last.
      # GAP 1 FIX — install the CALLER's Python RUNTIME deps before running the
      # tests. Without this, a repo whose tests import a runtime dependency
      # fails with ModuleNotFoundError (observed: env-inspector -> "No module
      # named defusedxml"; the lane previously installed only pytest/coverage).
      # Priority order: requirements*.txt -> pyproject.toml / setup.cfg /
      # setup.py (PEP 517 install of the project itself, which pulls its
      # declared dependencies, incl. Poetry's [tool.poetry.dependencies]).
      # If NONE exist the repo is pure-stdlib -> proceed (no-op). Best-effort:
      # a failing optional/heavy install must not mask the real test result,
      # so each install is guarded and only logged on failure.
      - name: Install the caller's Python runtime dependencies
        id: py_deps
        if: steps.detect.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installed_runtime_deps=false
          mapfile -t reqs < <(git ls-files \
            requirements.txt 'requirements/*.txt' 'requirements-*.txt' 'requirements*.txt' \
            '**/requirements.txt' 2>/dev/null \
            | grep -Ev '(^|/)(node_modules|\.venv|venv|dist|build|out)/' \
            | grep -Eiv 'requirements.*(dev|test|lint|doc|ci).*\.txt$' || true)
          if [ "${#reqs[@]}" -gt 0 ]; then
            for r in "${reqs[@]}"; do
              echo "::group::pip install -r $r"
              pip install -r "$r" || echo "WARN: 'pip install -r $r' failed; continuing (gates 2 and 3 will surface any missing import)."
              echo "::endgroup::"
            done
            installed_runtime_deps=true
          elif [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
            echo "::group::pip install . (project deps from pyproject/setup.cfg/setup.py)"
            pip install . || echo "WARN: 'pip install .' failed; continuing (gates 2 and 3 will surface any missing import)."
            echo "::endgroup::"
            installed_runtime_deps=true
          fi
          [ "$installed_runtime_deps" = "true" ] || echo "No Python runtime manifest (requirements*.txt / pyproject.toml / setup.cfg / setup.py) - assuming pure-stdlib; proceeding."

      # ── Pinned scanner CLIs (only when their language/config is present) ──────
      - name: Install ruff
        if: steps.detect.outputs.python == 'true'
        run: pip install ruff==0.15.17

      - name: Install basedpyright
        if: steps.detect.outputs.python == 'true'
        run: pip install basedpyright==1.39.8

      # Every tool download below is the pinned release ASSET itself, fetched
      # with curl -f (an HTTP error fails the step instead of saving an error
      # page) and checked against the SHA-256 in .quality/tool-pins.yml
      # (asset_sha256) BEFORE it is installed: a tampered or truncated download
      # can never reach PATH. No remote install script is executed.
      #
      # Unconditional since round-10: gate 4 always runs (the caller's ruleset
      # or the platform default), so the binary is always needed.
      - name: Install opengrep
        run: |
          set -euo pipefail
          # the asset opengrep's install.sh selects on a glibc x86-64 runner
          dir="$HOME/.opengrep/cli/latest"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/opengrep.download" \
            https://github.com/opengrep/opengrep/releases/download/v1.22.0/opengrep_manylinux_x86
          echo "45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319  $dir/opengrep.download" | sha256sum -c -
          mv "$dir/opengrep.download" "$dir/opengrep"
          chmod +x "$dir/opengrep"
          echo "$dir" >> "$GITHUB_PATH"

      # Unconditional: gate 5 is T0 absolute-zero and always runs, so the binary
      # is always needed. It is NOT gated on the .gitleaks.toml allowlist —
      # that inversion is the bug this restores.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

      # Unconditional, like gate 6 itself: which manifests and lockfiles are
      # scannable is osv-scanner's own knowledge (bun.lock, uv.lock, NuGet,
      # pubspec, mix...), and a repo with none makes it exit 128 in a second.
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  /tmp/osv-scanner" | sha256sum -c -
          install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner

      # ── Lean-gate helper scripts (EMBEDDED VERBATIM) ─────────────────────
      # This reusable workflow runs inside the CALLER's checkout and has NO
      # access to quality-zero-platform's own `scripts/` tree, so its Python
      # helpers are embedded here VERBATIM rather than fetched (a fetch would
      # either be unpinned or skew against a caller pinned to an older workflow
      # ref, and checking the platform out into the caller's workspace would
      # pollute the very tree the SAST / secrets / deps gates scan).
      #
      # Each module in quality-zero-platform is the unit-tested source of truth
      # (100% line+branch, real-data fixtures). The copies below are asserted
      # BYTE-IDENTICAL to them by `tests/test_lean_gate_embedded_helpers.py`,
      # whose extractor is detector-controlled, so the two cannot drift: edit
      # the module, re-paste it here, or that test goes red.
      #
      # Deliberately UNCONDITIONAL. Writing a few small files costs nothing, and
      # an `if:` guard here is a standing drift hazard: a future lane that needs
      # a helper but whose guard was not added to this step would fail with a
      # confusing "No such file" instead of running.
      - name: Materialize the lean-gate helper scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/qzp-lean-gate"
          cat > "${RUNNER_TEMP}/qzp-lean-gate/jsts_coverage_assert.py" <<'QZP_EMBED_jsts_coverage_assert'
          #!/usr/bin/env python3
          """Assert the JS/TS coverage number the gate-3 lane just produced.

          The jsts lane used to run the caller's coverage script and pass on exit 0. It
          passed NO threshold and checked NO number: enforcement was delegated entirely to
          the caller's vitest/karma config, and the gate never verified that one existed.
          Measured 2026-08-11 on momentstudio's frontend, the run printed
          ``Statements : 49.57%`` and the lane printed ``PASS gate-tests-coverage jsts``.

          This module reads the summary the run just produced and compares it to a number.
          Evidence is taken in strength order, machine-readable artifacts first because a
          printed table is a rendering of the data, not the data:

          1. ``coverage/**/coverage-summary.json``  (istanbul ``json-summary``)
          2. ``coverage/**/clover.xml``             (vitest's default reporter set)
          3. ``coverage/**/lcov.info``              (karma / Angular default)
          4. the coverage run's own printed summary (istanbul text-summary block, or the
             ``All files`` row of the text table)

          The property that holds regardless of any threshold: **a run that produces no
          parseable summary FAILS.** ``--min-percent`` can move the bar but can never
          switch off the requirement that a real number was measured, and it is rejected
          outside ``(0, 100]`` so a "0% bar" silent pass is not expressible.

          Branch coverage is compared too (the charter is 100% line AND branch), except
          where the report says the project has zero conditionals - that is "not
          applicable", not 0%.

          XML is parsed with a regex rather than ``xml.etree``, mirroring
          ``scripts/quality/coverage_parsers.py``: it avoids the XML-parser attack surface
          the ``S`` lint rules flag, and clover's metrics live in element attributes.

          Exit codes: ``0`` at or above the bar, ``1`` below it or unmeasured, ``2`` the
          threshold argument itself is invalid.
          """

          from __future__ import absolute_import

          import argparse
          import json
          import re
          import sys
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Any, List, Optional

          DEFAULT_MIN_PERCENT = 100.0
          COVERAGE_DIR = "coverage"
          EXIT_OK = 0
          EXIT_BELOW_BAR = 1
          EXIT_CONFIG_ERROR = 2

          _CLOVER_METRIC = re.compile(r'(\w+)\s*=\s*"(\d+)"')
          _TEXT_ROW = re.compile(r"^\s*(Statements|Branches|Lines)\s*:\s*([0-9.]+)%\s*\(\s*(\d+)\s*/\s*(\d+)\s*\)", re.MULTILINE)
          _ALL_FILES_ROW = re.compile(r"^[|\s]*All files\s*\|(.+)$", re.MULTILINE)


          @dataclass(frozen=True)
          class CoverageSummary:
              """A measured coverage result and where the number came from."""

              origin: str
              lines_pct: float
              branches_pct: Optional[float]


          def _percent(covered: int, total: int) -> Optional[float]:
              """Return a percentage, or ``None`` when the denominator is zero."""
              if total <= 0:
                  return None
              return round(covered * 100.0 / total, 2)


          def _as_float(value: Any) -> Optional[float]:
              """Coerce a reported percentage to a float, or ``None`` when it is not one."""
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None


          def summary_from_json_summary(path: Path) -> Optional[CoverageSummary]:
              """Parse an istanbul ``json-summary`` report."""
              try:
                  document = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None
              if not isinstance(document, dict):
                  return None
              total = document.get("total")
              if not isinstance(total, dict):
                  return None
              lines = total.get("lines") if isinstance(total.get("lines"), dict) else {}
              branches = total.get("branches") if isinstance(total.get("branches"), dict) else {}
              lines_pct = _as_float(lines.get("pct"))
              if lines_pct is None or _as_float(lines.get("total")) in (None, 0.0):
                  return None
              branches_total = _as_float(branches.get("total"))
              branches_pct = None if branches_total in (None, 0.0) else _as_float(branches.get("pct"))
              return CoverageSummary(origin=str(path), lines_pct=lines_pct, branches_pct=branches_pct)


          def summary_from_clover(path: Path) -> Optional[CoverageSummary]:
              """Parse the project-level ``<metrics .../>` of a clover report."""
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError:
                  return None
              match = re.search(r"<metrics\b([^>]*)>", text)
              if match is None:
                  return None
              metrics = {key.lower(): int(value) for key, value in _CLOVER_METRIC.findall(match.group(1))}
              lines_pct = _percent(metrics.get("coveredstatements", 0), metrics.get("statements", 0))
              if lines_pct is None:
                  return None
              branches_pct = _percent(metrics.get("coveredconditionals", 0), metrics.get("conditionals", 0))
              return CoverageSummary(origin=str(path), lines_pct=lines_pct, branches_pct=branches_pct)


          def summary_from_lcov(path: Path) -> Optional[CoverageSummary]:
              """Sum the ``LF``/``LH`` and ``BRF``/``BRH`` counters of an lcov report."""
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError:
                  return None
              totals = {"LF": 0, "LH": 0, "BRF": 0, "BRH": 0}
              for line in text.splitlines():
                  key, _, raw = line.partition(":")
                  if key not in totals:
                      continue
                  try:
                      totals[key] += int(raw.strip())
                  except ValueError:
                      continue
              lines_pct = _percent(totals["LH"], totals["LF"])
              if lines_pct is None:
                  return None
              return CoverageSummary(origin=str(path), lines_pct=lines_pct, branches_pct=_percent(totals["BRH"], totals["BRF"]))


          def _summary_from_text_block(text: str) -> Optional[CoverageSummary]:
              """Parse the istanbul ``Coverage summary`` block."""
              rows = {}
              for label, pct, _covered, total in _TEXT_ROW.findall(text):
                  if int(total) > 0:
                      rows[label] = float(pct)
              lines_pct = rows.get("Lines", rows.get("Statements"))
              if lines_pct is None:
                  return None
              return CoverageSummary(
                  origin="the coverage run's printed summary",
                  lines_pct=lines_pct,
                  branches_pct=rows.get("Branches"),
              )


          def _summary_from_text_table(text: str) -> Optional[CoverageSummary]:
              """Parse the ``All files`` row of the istanbul / vitest text table."""
              match = _ALL_FILES_ROW.search(text)
              if match is None:
                  return None
              cells = [cell.strip() for cell in match.group(1).split("|")]
              if len(cells) < 4:
                  return None
              statements, branches, _functions, lines = (_as_float(cell) for cell in cells[:4])
              if lines is None or statements is None:
                  return None
              return CoverageSummary(
                  origin="the coverage run's printed summary",
                  lines_pct=lines,
                  branches_pct=branches,
              )


          def summary_from_text(text: str) -> Optional[CoverageSummary]:
              """Parse whichever printed coverage shape the runner emitted."""
              return _summary_from_text_block(text) or _summary_from_text_table(text)


          def discover(project_dir: Path, log_text: str) -> Optional[CoverageSummary]:
              """Find the strongest available coverage evidence for ``project_dir``."""
              readers = (
                  ("coverage-summary.json", summary_from_json_summary),
                  ("clover.xml", summary_from_clover),
                  ("lcov.info", summary_from_lcov),
              )
              coverage_root = project_dir / COVERAGE_DIR
              for filename, reader in readers:
                  for candidate in sorted(coverage_root.rglob(filename)):
                      summary = reader(candidate)
                      if summary is not None:
                          return summary
              return summary_from_text(log_text)


          def evaluate(summary: CoverageSummary, min_percent: float) -> List[str]:
              """Return one finding per coverage dimension that is below the bar."""
              findings: List[str] = []
              if summary.lines_pct < min_percent:
                  findings.append(f"line coverage {summary.lines_pct:.2f}% is below the required {min_percent:.2f}%")
              if summary.branches_pct is not None and summary.branches_pct < min_percent:
                  findings.append(f"branch coverage {summary.branches_pct:.2f}% is below the required {min_percent:.2f}%")
              return findings


          def _read_log(log_path: Optional[str]) -> str:
              """Read the captured coverage-run output, tolerating a missing file."""
              if not log_path:
                  return ""
              try:
                  return Path(log_path).read_text(encoding="utf-8", errors="replace")
              except OSError:
                  return ""


          def _build_parser() -> argparse.ArgumentParser:
              """Build the CLI parser."""
              parser = argparse.ArgumentParser(description="Assert the coverage a JS/TS project just measured.")
              parser.add_argument("--project-dir", required=True, help="Directory the coverage script ran in.")
              parser.add_argument("--log", default=None, help="File holding the coverage run's captured output.")
              parser.add_argument(
                  "--min-percent",
                  type=float,
                  default=DEFAULT_MIN_PERCENT,
                  help=f"Required line and branch coverage, in (0, 100] (default {DEFAULT_MIN_PERCENT}).",
              )
              return parser


          def main(argv: Optional[List[str]] = None) -> int:
              """Assert the measured coverage and return the lane's exit code."""
              args = _build_parser().parse_args(argv)
              if not 0 < args.min_percent <= 100:
                  print(
                      f"ERROR gate-tests-coverage jsts: --min-percent {args.min_percent} must be greater than 0 "
                      "and at most 100. A 0% bar is a silent pass wearing a number; a bar above 100 is unreachable.",
                      file=sys.stderr,
                  )
                  return EXIT_CONFIG_ERROR
              project_dir = Path(args.project_dir)
              summary = discover(project_dir, _read_log(args.log))
              if summary is None:
                  print(
                      f"FAIL gate-tests-coverage jsts: the coverage script ran in '{project_dir}' but produced NO parseable "
                      "coverage summary, so the gate cannot pass it unmeasured. Looked for "
                      "coverage/**/coverage-summary.json, coverage/**/clover.xml, coverage/**/lcov.info and a printed "
                      "summary. Remediation: add the 'json-summary' (or 'lcov') coverage reporter to the project's "
                      "vitest/jest/karma config.",
                      file=sys.stderr,
                  )
                  return EXIT_BELOW_BAR
              branches = "n/a (no conditionals)" if summary.branches_pct is None else f"{summary.branches_pct:.2f}%"
              print(
                  f"gate-tests-coverage jsts: measured line {summary.lines_pct:.2f}%, branch {branches} "
                  f"against a required {args.min_percent:.2f}% (source: {summary.origin})"
              )
              findings = evaluate(summary, args.min_percent)
              if findings:
                  for finding in findings:
                      print(f"FAIL gate-tests-coverage jsts: {finding}.", file=sys.stderr)
                  return EXIT_BELOW_BAR
              print("PASS gate-tests-coverage jsts: the measured coverage meets the required threshold.")
              return EXIT_OK


          if __name__ == "__main__":
              raise SystemExit(main())
          QZP_EMBED_jsts_coverage_assert
          cat > "${RUNNER_TEMP}/qzp-lean-gate/osv_severity_gate.py" <<'QZP_EMBED_osv_severity_gate'
          #!/usr/bin/env python3
          """Severity floor for gate 6 (deps) - the T0 tier of the lean gate.

          ``osv-scanner`` exits 1 for ANY finding. The lean gate used to map that exit
          straight onto a red branch, with no severity floor, no dev/prod split and no
          check that a fix even exists. Measured consequence (2026-08-11): 22 of 34 open
          fleet PRs were BLOCKED on ``gate-deps``, and DevExtreme PR #40 - itself a
          *security* bump - sat blocked for 17 days behind an UNSCORED Go stdlib
          advisory that no version bump in that PR could clear.

          This module re-reads the SAME scan as JSON and splits it in two:

          ``BLOCK``
              NOT dev-only **AND** ``max_severity`` parses to a float >= the floor
              (default 7.0 = CVSS High) **AND** the report names a fixed version.

          ``T2``
              Everything else - dev-only, unscored, below the floor, or unfixable.
              T2 findings are **printed in full**. Demoted is not hidden.

          Design constraint this encodes: a gate the owner cannot drive to green is a
          defect regardless of what it detects. Every BLOCK row names a fixed version,
          so every BLOCK is closable by an action the owner controls.

          Schema notes, measured against the pinned ``osv-scanner v2.3.8`` binary:

          * ``results[].packages[].dependency_groups`` is **ABSENT** for production
            dependencies (and for Go), ``["dev"]`` / ``["dev","optional"]`` otherwise.
          * ``results[].packages[].groups[].max_severity`` is a **string** and is the
            **empty string** for unscored advisories (every Go stdlib advisory is
            unscored). It is not ``null`` - parse it defensively either way.
          * A group's ``ids`` are not guaranteed to appear in ``vulnerabilities[]``;
            when they do not, no fixed version can be established and the finding is
            demoted rather than blocking on data we do not have.

          Exit codes: ``0`` no blocking findings, ``1`` at least one blocking finding,
          ``2`` the report could not be read or parsed (never treated as "clean").
          """

          from __future__ import absolute_import

          import argparse
          import json
          import sys
          from dataclasses import dataclass, replace
          from pathlib import Path
          from typing import Any, Iterable, List, Mapping, Optional, Sequence, TextIO, Tuple

          SEVERITY_FLOOR = 7.0
          """Default CVSS floor. 7.0 is the CVSS v3 boundary between Medium and High."""

          DEV_ONLY_GROUPS = frozenset(("dev", "optional"))
          """Dependency groups that may take part in a dev-only demotion.

          ``optional`` alone is deliberately NOT enough: an npm ``optionalDependency``
          IS installed in production. Only a package that is reachable *via* the dev
          tree (i.e. its group set contains ``dev``) is demoted for scope.
          """

          UNKNOWN = "<unknown>"

          EXIT_OK = 0
          EXIT_BLOCKED = 1
          EXIT_INPUT_ERROR = 2


          class ReportInputError(RuntimeError):
              """The osv-scanner report could not be read or parsed."""


          @dataclass(frozen=True)
          class Finding:
              """One osv-scanner finding-GROUP (a package x advisory-group pair)."""

              source: str
              package: str
              version: str
              ecosystem: str
              dependency_groups: Tuple[str, ...]
              ids: Tuple[str, ...]
              max_severity_raw: str
              severity: Optional[float]
              fixed_versions: Tuple[str, ...]
              dev_only: bool
              reasons: Tuple[str, ...] = ()


          def parse_severity(raw_value: Any) -> Optional[float]:
              """Parse ``max_severity`` into a float, or ``None`` when it is unscored.

              ``max_severity`` is a STRING and is ``""`` for unscored advisories. An
              unscored advisory must never collapse to ``0.0`` (that would silently read
              as "below the floor" for the wrong reason) nor to a crash.
              """
              try:
                  return float(raw_value)
              except (TypeError, ValueError):
                  return None


          def normalize_groups(raw_value: Any) -> Tuple[str, ...]:
              """Normalise ``dependency_groups`` to a lowercased tuple.

              The key is ABSENT (``None``) for production dependencies, so anything that
              is not a list is treated as "no groups" == production.
              """
              if not isinstance(raw_value, list):
                  return ()
              return tuple(str(item).strip().lower() for item in raw_value)


          def is_dev_only(groups: Sequence[str]) -> bool:
              """Return True when every group is a dev-tree group AND ``dev`` is one."""
              if not groups:
                  return False
              if not set(groups) <= DEV_ONLY_GROUPS:
                  return False
              return "dev" in groups


          def fixed_versions_for(package_entry: Mapping[str, Any], advisory_ids: Iterable[str]) -> Tuple[str, ...]:
              """Collect every ``fixed`` version published for ``advisory_ids``.

              An empty result means "this report names no fix", which is a demotion
              reason: the owner cannot bump their way out of it.
              """
              wanted = set(advisory_ids)
              found = set()
              for vulnerability in package_entry.get("vulnerabilities") or []:
                  if not isinstance(vulnerability, dict) or vulnerability.get("id") not in wanted:
                      continue
                  for affected in vulnerability.get("affected") or []:
                      if not isinstance(affected, dict):
                          continue
                      for affected_range in affected.get("ranges") or []:
                          if not isinstance(affected_range, dict):
                              continue
                          for event in affected_range.get("events") or []:
                              if isinstance(event, dict) and "fixed" in event:
                                  found.add(str(event["fixed"]))
              return tuple(sorted(found))


          def _finding_from_group(
              *,
              source_path: str,
              meta: Mapping[str, Any],
              groups: Tuple[str, ...],
              dev_only: bool,
              package_entry: Mapping[str, Any],
              group: Mapping[str, Any],
          ) -> Finding:
              """Build one ``Finding`` from a single ``groups[]`` entry."""
              ids = tuple(str(item) for item in group.get("ids") or [])
              raw_severity = group.get("max_severity", "")
              return Finding(
                  source=source_path,
                  package=str(meta.get("name", UNKNOWN)),
                  version=str(meta.get("version", UNKNOWN)),
                  ecosystem=str(meta.get("ecosystem", UNKNOWN)),
                  dependency_groups=groups,
                  ids=ids,
                  max_severity_raw=str(raw_severity),
                  severity=parse_severity(raw_severity),
                  fixed_versions=fixed_versions_for(package_entry, ids),
                  dev_only=dev_only,
              )


          def iter_findings(document: Any) -> List[Finding]:
              """Flatten an osv-scanner JSON report into one ``Finding`` per group."""
              findings: List[Finding] = []
              if not isinstance(document, dict):
                  return findings
              for result in document.get("results") or []:
                  if not isinstance(result, dict):
                      continue
                  source_block = result.get("source")
                  source_path = str(source_block.get("path", UNKNOWN)) if isinstance(source_block, dict) else UNKNOWN
                  for package_entry in result.get("packages") or []:
                      if not isinstance(package_entry, dict):
                          continue
                      raw_meta = package_entry.get("package")
                      meta = raw_meta if isinstance(raw_meta, dict) else {}
                      groups = normalize_groups(package_entry.get("dependency_groups"))
                      dev_only = is_dev_only(groups)
                      for group in package_entry.get("groups") or []:
                          if not isinstance(group, dict):
                              continue
                          findings.append(
                              _finding_from_group(
                                  source_path=source_path,
                                  meta=meta,
                                  groups=groups,
                                  dev_only=dev_only,
                                  package_entry=package_entry,
                                  group=group,
                              )
                          )
              return findings


          def demotion_reasons(finding: Finding, floor: float) -> Tuple[str, ...]:
              """Return every reason this finding is T2 rather than blocking (may be empty)."""
              reasons: List[str] = []
              if finding.dev_only:
                  reasons.append("dev-only")
              if finding.severity is None:
                  reasons.append("unscored")
              elif finding.severity < floor:
                  reasons.append("below-floor")
              if not finding.fixed_versions:
                  reasons.append("no-fix-available")
              return tuple(reasons)


          def classify(findings: Iterable[Finding], floor: float) -> Tuple[List[Finding], List[Finding]]:
              """Split findings into ``(blocking, demoted)``, annotating demotion reasons."""
              blocking: List[Finding] = []
              demoted: List[Finding] = []
              for finding in findings:
                  reasons = demotion_reasons(finding, floor)
                  annotated = replace(finding, reasons=reasons)
                  if reasons:
                      demoted.append(annotated)
                  else:
                      blocking.append(annotated)
              return blocking, demoted


          def format_finding(finding: Finding) -> str:
              """Render one finding as a single reviewable line."""
              advisories = ", ".join(finding.ids) or "<no advisory id>"
              severity = "-" if finding.severity is None else format(finding.severity, "g")
              scope = "+".join(finding.dependency_groups) or "prod"
              fix = "fixed in " + ", ".join(finding.fixed_versions) if finding.fixed_versions else "no published fix"
              return (
                  f"{finding.package} {finding.version} ({finding.ecosystem}) [{scope}] "
                  f"severity {severity} | {advisories} | {fix} | {finding.source}"
              )


          def _rows(findings: Sequence[Finding], *, with_reasons: bool) -> List[str]:
              """Render a section body, or an explicit ``none`` when the section is empty."""
              if not findings:
                  return ["  none"]
              rows: List[str] = []
              for finding in findings:
                  prefix = ""
                  if with_reasons:
                      prefix = "[" + "+".join(finding.reasons) + "] "
                  rows.append("  - " + prefix + format_finding(finding))
              return rows


          def render_report(blocking: Sequence[Finding], demoted: Sequence[Finding], floor: float) -> str:
              """Render both tiers. A T2 finding is demoted, never hidden."""
              lines = [
                  "== gate-deps severity floor (T0) ==",
                  f"   BLOCK when: NOT dev-only AND CVSS >= {format(floor, 'g')} AND a fixed version exists.",
                  "   Everything else is T2 inventory: reported below, never blocking.",
                  "",
                  f"BLOCKING ({len(blocking)}):",
              ]
              lines.extend(_rows(blocking, with_reasons=False))
              lines.append("")
              lines.append(f"T2 INVENTORY ({len(demoted)}):")
              lines.extend(_rows(demoted, with_reasons=True))
              return "\n".join(lines)


          def load_document(source: str, stdin: Optional[TextIO] = None) -> Any:
              """Read the osv-scanner report from ``-`` (stdin) or a filesystem path."""
              if source == "-":
                  stream = sys.stdin if stdin is None else stdin
                  raw = stream.read()
              else:
                  try:
                      raw = Path(source).read_text(encoding="utf-8")
                  except OSError as exc:
                      raise ReportInputError(f"cannot read osv-scanner report '{source}': {exc}") from exc
              try:
                  return json.loads(raw)
              except ValueError as exc:
                  raise ReportInputError(f"osv-scanner report '{source}' is not valid JSON: {exc}") from exc


          def _build_parser() -> argparse.ArgumentParser:
              """Build the CLI parser."""
              parser = argparse.ArgumentParser(
                  description="Split an osv-scanner JSON report into blocking (T0) and inventory (T2) findings.",
              )
              parser.add_argument(
                  "report",
                  nargs="?",
                  default="-",
                  help="Path to an 'osv-scanner ... --format json' report, or '-' for stdin (default).",
              )
              parser.add_argument(
                  "--min-severity",
                  type=float,
                  default=SEVERITY_FLOOR,
                  help=f"CVSS floor at or above which a fixable production finding blocks (default {SEVERITY_FLOOR}).",
              )
              return parser


          def main(argv: Optional[List[str]] = None) -> int:
              """Classify a report, print both tiers, and return the gate exit code."""
              args = _build_parser().parse_args(argv)
              try:
                  document = load_document(args.report)
              except ReportInputError as exc:
                  print(f"ERROR gate-deps severity floor: {exc}", file=sys.stderr)
                  return EXIT_INPUT_ERROR
              blocking, demoted = classify(iter_findings(document), args.min_severity)
              print(render_report(blocking, demoted, args.min_severity))
              if blocking:
                  print(
                      f"FAIL gate-deps: {len(blocking)} blocking finding(s) - "
                      "production dependency, CVSS at or above the floor, and a fix is published. Bump them.",
                      file=sys.stderr,
                  )
                  return EXIT_BLOCKED
              print(f"PASS gate-deps: 0 blocking finding(s); {len(demoted)} demoted to T2 inventory (listed above).")
              return EXIT_OK


          if __name__ == "__main__":
              raise SystemExit(main())
          QZP_EMBED_osv_severity_gate
          cat > "${RUNNER_TEMP}/qzp-lean-gate/jsts_projects.py" <<'QZP_EMBED_jsts_projects'
          #!/usr/bin/env python3
          """Plan which JS/TS projects gate 3 must measure.

          The jsts coverage lane used to measure ONLY the root project whenever a root
          ``package.json`` existed: nested discovery ran only when the root had none. So a
          nested project (``frontend/``, ``packages/ui``) with its own tests and its own
          coverage script was never run, and a nested project with tests and NO coverage
          script was never flagged - while the lane printed PASS.

          This module turns ``git ls-files`` output into the full project plan:

          * every ``package.json`` outside vendored / build trees and outside fixture /
            test-data trees (``fixtures/``, ``__fixtures__/``, ``testdata/``,
            ``__mocks__/``...: a manifest there is test INPUT, not a runnable package) is
            a project;
          * every JS/TS test file is attributed to its DEEPEST enclosing project. A test
            file is a ``*.test.*`` / ``*.spec.*`` / ``*.cy.*`` (Cypress) file, anything
            under ``__tests__/``, or (Mocha-style layouts) a JS/TS file under a ``test/``
            or ``tests/`` directory inside a project - never a file in a fixture tree;
          * a project that the root ``package.json`` ``workspaces`` (or a root
            ``pnpm-workspace.yaml``) declares is marked as a workspace member, so the
            lane can say why a root workspace run does not count for it.

          Output is one tab-separated line per project, the root first and then the rest
          sorted by path::

              <dir>\t<has_tests: yes|no>\t<workspace_member: yes|no>

          ``has_tests`` is the project's OWN test files. The lane runs every project
          that DECLARES a coverage lane, whatever this says (no file-name heuristic may
          decide that a declared runner has nothing to run); ``has_tests`` decides only
          what a project WITHOUT a lane is: unmeasured (it has tests) or nothing to
          measure. Every project with tests needs its OWN lane, workspace members
          included: a root workspace run can show that a member's code was covered,
          never that the member's own tests ran (a root ``jest src --coverage`` that
          merely imports the member covers its code and runs none of its tests), and a
          coverage report on disk may predate the run. A member therefore needs its own
          ``test:coverage``.

          ``*.test.*`` / ``*.spec.*`` / ``*.cy.*`` / ``__tests__`` files that belong to
          no project at all are reported on stderr and, with ``--orphans-out``, written to
          a file so the lane can fail on them: no coverage lane ever runs them. A file under a
          ``test/`` directory outside every project is not an orphan: outside a JS/TS
          project that name says nothing about JavaScript tests.

          The module is pure standard library because the lane runs it with the runner's
          bare ``python3``.
          """

          from __future__ import absolute_import

          import argparse
          import fnmatch
          import json
          import re
          import sys
          from pathlib import Path
          from typing import Iterable, List, Optional, Sequence, Tuple

          VENDORED = re.compile(r"(^|/)(node_modules|dist|out|build|\.venv|vendor)/")
          """Trees that are never first-party projects or first-party tests."""

          JSTS_TEST = re.compile(r"(\.(test|spec|cy)\.([cm]?[jt]s|[jt]sx)$)|((^|/)__tests__/.+\.([cm]?[jt]s|[jt]sx)$)")
          """A JS/TS test file by name: ``*.test.*`` / ``*.spec.*`` / ``*.cy.*`` or anything under ``__tests__/``."""

          JSTS_TEST_DIR = re.compile(r"(^|/)tests?/.+\.([cm]?[jt]s|[jt]sx)$")
          """A JS/TS file under a ``test/`` or ``tests/`` directory: Mocha-style layouts (``test/smoke.js``)."""

          FIXTURES = re.compile(r"(^|/)(fixtures?|__fixtures__|testdata|test-data|__mocks__)/")
          """Test-data trees: their files are inputs, never tests, and their package.json files are never projects."""

          ROOT = "."

          PlanRow = Tuple[str, bool, bool]


          def project_dirs(paths: Iterable[str]) -> List[str]:
              """Return every project directory: the directory of each first-party, non-fixture package.json."""
              dirs = set()
              for path in paths:
                  if VENDORED.search(path) or FIXTURES.search(path):
                      continue
                  if path == "package.json":
                      dirs.add(ROOT)
                  elif path.endswith("/package.json"):
                      dirs.add(path[: -len("/package.json")])
              return sorted(dirs, key=lambda item: (item != ROOT, item))


          def owning_project(path: str, dirs: Sequence[str]) -> Optional[str]:
              """Return the DEEPEST project directory that contains ``path``, if any."""
              best: Optional[str] = None
              for candidate in dirs:
                  inside = candidate == ROOT or path.startswith(candidate + "/")
                  if inside and (best is None or best == ROOT or len(candidate) > len(best)):
                      best = candidate
              return best


          def _pnpm_globs(text: str) -> List[str]:
              """Read the ``packages:`` list of a ``pnpm-workspace.yaml`` without a YAML parser."""
              globs: List[str] = []
              in_packages = False
              for raw in text.splitlines():
                  line = raw.split("#", 1)[0].rstrip()
                  if not line.strip():
                      continue
                  if not line.startswith((" ", "\t", "-")):
                      in_packages = line.strip() == "packages:"
                      continue
                  item = line.strip()
                  if in_packages and item.startswith("-"):
                      value = item[1:].strip().strip("'\"")
                      if value:
                          globs.append(value)
              return globs


          def workspace_globs(root_package_json: str = "", pnpm_workspace: str = "") -> List[str]:
              """Return the workspace globs a root package.json / pnpm-workspace.yaml declares."""
              globs: List[str] = []
              if root_package_json:
                  try:
                      document = json.loads(root_package_json)
                  except ValueError:
                      document = {}
                  workspaces = document.get("workspaces") if isinstance(document, dict) else None
                  if isinstance(workspaces, dict):
                      workspaces = workspaces.get("packages")
                  if isinstance(workspaces, list):
                      globs.extend(str(item) for item in workspaces if isinstance(item, str) and item.strip())
              if pnpm_workspace:
                  globs.extend(_pnpm_globs(pnpm_workspace))
              return globs


          def _match_segments(parts: Sequence[str], patterns: Sequence[str]) -> bool:
              """Match path segments against glob segments; ``**`` spans any number of them."""
              if not patterns:
                  return not parts
              head, rest = patterns[0], patterns[1:]
              if head == "**":
                  return any(_match_segments(parts[index:], rest) for index in range(len(parts) + 1))
              return bool(parts) and fnmatch.fnmatchcase(parts[0], head) and _match_segments(parts[1:], rest)


          def glob_match(directory: str, pattern: str) -> bool:
              """Workspace-glob semantics: ``*`` stays inside ONE path segment, ``**`` crosses them.

              ``fnmatch`` alone lets ``*`` match ``/``, so ``packages/*`` would also claim
              ``packages/a/b`` - a nested project npm/pnpm would NOT treat as a member,
              which the lane would then pass as "measured by the root" without measuring.
              """
              return _match_segments(directory.split("/"), pattern.split("/"))


          def is_workspace_member(directory: str, globs: Sequence[str]) -> bool:
              """True when ``directory`` matches an include glob and no ``!``-exclusion glob."""
              if directory == ROOT:
                  return False
              included = False
              for glob in globs:
                  pattern = glob.strip().rstrip("/")
                  excluded = pattern.startswith("!")
                  if excluded:
                      pattern = pattern[1:]
                  if pattern.startswith("./"):
                      pattern = pattern[2:]
                  if not glob_match(directory, pattern):
                      continue
                  if excluded:
                      return False
                  included = True
              return included


          def plan(
              paths: Sequence[str],
              *,
              root_package_json: str = "",
              pnpm_workspace: str = "",
          ) -> Tuple[List[PlanRow], List[str]]:
              """Return ``(rows, orphan_tests)`` for the tracked file list ``paths``.

              ``has_tests`` is the project's OWN test files only: a workspace root does
              not inherit its members' tests, and an aggregator root without tests of its
              own has nothing to measure.
              """
              dirs = project_dirs(paths)
              with_tests = set()
              orphans: List[str] = []
              for path in paths:
                  named = JSTS_TEST.search(path)
                  if VENDORED.search(path) or FIXTURES.search(path) or not (named or JSTS_TEST_DIR.search(path)):
                      continue
                  owner = owning_project(path, dirs)
                  if owner is not None:
                      with_tests.add(owner)
                  elif named:
                      orphans.append(path)
              globs = workspace_globs(root_package_json, pnpm_workspace)
              rows = [(directory, directory in with_tests, is_workspace_member(directory, globs)) for directory in dirs]
              return rows, orphans


          def render(rows: Sequence[PlanRow]) -> str:
              """Render the plan as the tab-separated lines the lane reads."""
              return "".join(
                  f"{directory}\t{'yes' if has_tests else 'no'}\t{'yes' if member else 'no'}\n"
                  for directory, has_tests, member in rows
              )


          def _read_optional(path: str) -> str:
              """Read ``path`` as UTF-8, or return an empty string when no path was given."""
              if not path:
                  return ""
              return Path(path).read_text(encoding="utf-8")


          def _split_paths(text: str) -> List[str]:
              """Split ``git ls-files`` output: NUL-separated (``-z``) or one path per line."""
              separator = "\0" if "\0" in text else "\n"
              return [item.strip() for item in text.split(separator) if item.strip()]


          def _build_parser() -> argparse.ArgumentParser:
              """Build the CLI parser."""
              parser = argparse.ArgumentParser(description="Plan the JS/TS projects gate 3 must measure.")
              parser.add_argument("--files", default="", help="File holding `git ls-files -z` (or one-per-line) output.")
              parser.add_argument("--root-package-json", default="", help="The root package.json, if the repo has one.")
              parser.add_argument("--pnpm-workspace", default="", help="The root pnpm-workspace.yaml, if the repo has one.")
              parser.add_argument("--orphans-out", default="", help="Write test files outside every project here.")
              return parser


          def main(argv: Optional[Sequence[str]] = None) -> int:
              """Print the project plan for the file list given with ``--files``."""
              args = _build_parser().parse_args(argv)
              if not args.files:
                  print("ERROR jsts-projects: --files is required to plan", file=sys.stderr)
                  return 2
              try:
                  paths = _split_paths(Path(args.files).read_text(encoding="utf-8"))
                  root_package_json = _read_optional(args.root_package_json)
                  pnpm_workspace = _read_optional(args.pnpm_workspace)
              except OSError as exc:
                  print(f"ERROR jsts-projects: cannot read the plan inputs: {exc}", file=sys.stderr)
                  return 2
              rows, orphans = plan(paths, root_package_json=root_package_json, pnpm_workspace=pnpm_workspace)
              sys.stdout.write(render(rows))
              for orphan in orphans:
                  print(f"WARN jsts-projects: test file outside every package.json project: {orphan}", file=sys.stderr)
              if args.orphans_out:
                  Path(args.orphans_out).write_text("".join(f"{orphan}\n" for orphan in orphans), encoding="utf-8", newline="\n")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          QZP_EMBED_jsts_projects
          # Fail loudly HERE if a paste ever lands mis-indented, rather than
          # deep inside a gate where it would read as a scanner failure.
          for helper in jsts_coverage_assert osv_severity_gate jsts_projects; do
            python3 -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))" \
              "${RUNNER_TEMP}/qzp-lean-gate/${helper}.py"
            echo "materialized ${helper}.py"
          done

      # ── Platform default SAST ruleset (EMBEDDED VERBATIM) ────────────────
      # Gate 4 used to run ONLY when the caller shipped .quality/opengrep, so a
      # repo that had never written a ruleset got no SAST at all while the job
      # stayed green. Now the caller's ruleset still wins when it exists, and
      # every other caller is scanned with quality-zero-platform's own curated
      # ruleset (.quality/opengrep/*.yaml). The copies below are asserted
      # BYTE-IDENTICAL to those files by tests/test_lean_gate_embedded_helpers.py,
      # so the default a caller gets is exactly the ruleset this repo is held to,
      # versioned by the SAME ref the caller pins. Unconditional for the same
      # reason as the helper step above.
      - name: Materialize the platform default SAST ruleset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/qzp-lean-gate/opengrep-default"
          cat > "${RUNNER_TEMP}/qzp-lean-gate/opengrep-default/general-security.yaml" <<'QZP_EMBED_opengrep_general_security'
          # Curated language-agnostic security rules (subset of p/r2c-security-audit).
          # opengrep/semgrep compatible. See README.md.
          rules:
            - id: generic-private-key-committed
              languages: [generic]
              severity: ERROR
              message: >-
                A PEM private key block appears to be committed to source. Private keys
                must never live in the repo; use a secret manager / env vars.
              metadata:
                category: security
                cwe: "CWE-798: Use of Hard-coded Credentials"
              paths:
                exclude:
                  - "*.example"
                  - ".env.example"
                  - "**/tests/**"
                  - "**/fixtures/**"
              patterns:
                - pattern-regex: "-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----"

            - id: generic-aws-access-key-id
              languages: [generic]
              severity: ERROR
              message: >-
                A string matching an AWS Access Key ID was found. Rotate it and move
                credentials to a secret manager / environment variables.
              metadata:
                category: security
                cwe: "CWE-798"
              paths:
                exclude:
                  - "*.example"
                  - ".env.example"
                  - "**/tests/**"
              patterns:
                - pattern-regex: "\\b(AKIA|ASIA)[0-9A-Z]{16}\\b"
          QZP_EMBED_opengrep_general_security
          cat > "${RUNNER_TEMP}/qzp-lean-gate/opengrep-default/javascript-security.yaml" <<'QZP_EMBED_opengrep_javascript_security'
          # Curated JS/TS security rules (subset of p/javascript + p/r2c-security-audit).
          # opengrep/semgrep compatible. See README.md.
          rules:
            - id: js-eval-use
              languages: [javascript, typescript]
              severity: ERROR
              message: >-
                Use of eval() detected. eval on untrusted input enables code injection.
                Use a parser (e.g. JSON.parse) or explicit dispatch instead.
              metadata:
                category: security
                cwe: "CWE-95"
              patterns:
                - pattern: eval(...)

            - id: js-function-constructor
              languages: [javascript, typescript]
              severity: ERROR
              message: >-
                The Function constructor evaluates strings as code, equivalent to eval.
                Avoid constructing functions from dynamic strings.
              metadata:
                category: security
                cwe: "CWE-95"
              patterns:
                - pattern: new Function(...)

            - id: js-dangerously-set-inner-html
              languages: [javascript, typescript]
              severity: ERROR
              message: >-
                dangerouslySetInnerHTML can introduce XSS if the HTML is not sanitized.
                Sanitize with a vetted sanitizer or render as text.
              metadata:
                category: security
                cwe: "CWE-79: Cross-site Scripting"
              patterns:
                - pattern: <$EL dangerouslySetInnerHTML={...} />

            - id: js-document-write
              languages: [javascript, typescript]
              severity: ERROR
              message: >-
                document.write with dynamic content is an XSS sink. Build DOM nodes
                explicitly or set textContent.
              metadata:
                category: security
                cwe: "CWE-79"
              patterns:
                - pattern: document.write(...)

            - id: js-inner-html-assignment
              languages: [javascript, typescript]
              severity: ERROR
              message: >-
                Assigning to innerHTML with dynamic data is an XSS sink. Use textContent
                or a sanitizer.
              metadata:
                category: security
                cwe: "CWE-79"
              patterns:
                - pattern: $EL.innerHTML = $X
                - pattern-not: $EL.innerHTML = "..."

            - id: js-child-process-exec
              languages: [javascript, typescript]
              severity: ERROR
              message: >-
                child_process.exec runs a shell and is prone to command injection with
                dynamic input. Use execFile/spawn with an argument array.
              metadata:
                category: security
                cwe: "CWE-78"
              patterns:
                - pattern-either:
                    - pattern: child_process.exec($CMD, ...)
                    - pattern: cp.exec($CMD, ...)
                - pattern-not: child_process.exec("...", ...)

            - id: js-insecure-math-random-token
              languages: [javascript, typescript]
              severity: ERROR
              message: >-
                Math.random() is not cryptographically secure. For tokens/IDs/secrets use
                crypto.getRandomValues / crypto.randomUUID.
              metadata:
                category: security
                cwe: "CWE-338: Use of Cryptographically Weak PRNG"
              patterns:
                - pattern: $X = Math.random()
                - pattern-inside: |
                    function $F(...) { ... }
                - metavariable-regex:
                    metavariable: $X
                    regex: "(?i).*(token|secret|key|nonce|salt|password).*"
          QZP_EMBED_opengrep_javascript_security
          cat > "${RUNNER_TEMP}/qzp-lean-gate/opengrep-default/python-security.yaml" <<'QZP_EMBED_opengrep_python_security'
          # Curated Python security rules (subset of p/python + p/r2c-security-audit).
          # opengrep/semgrep compatible. See README.md.
          rules:
            - id: python-exec-use
              languages: [python]
              severity: ERROR
              message: >-
                Use of exec() detected. Executing dynamically-built code is dangerous and
                can lead to remote code execution. Avoid exec; use explicit dispatch.
              metadata:
                category: security
                cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
              patterns:
                - pattern: exec(...)

            - id: python-eval-use
              languages: [python]
              severity: ERROR
              message: >-
                Use of eval() detected. eval on untrusted input enables code injection.
                Use ast.literal_eval or an explicit parser instead.
              metadata:
                category: security
                cwe: "CWE-95"
              patterns:
                - pattern: eval(...)

            - id: python-subprocess-shell-true
              languages: [python]
              severity: ERROR
              message: >-
                subprocess called with shell=True. If any argument is attacker-influenced
                this allows command injection. Pass an argument list and shell=False.
              metadata:
                category: security
                cwe: "CWE-78: OS Command Injection"
              patterns:
                - pattern-either:
                    - pattern: subprocess.$F(..., shell=True, ...)
                    - pattern: subprocess.$F(..., shell=$X, ...)
                - metavariable-pattern:
                    metavariable: $X
                    patterns:
                      - pattern: "True"

            - id: python-os-system
              languages: [python]
              severity: ERROR
              message: >-
                os.system() invokes a shell and is prone to command injection. Use
                subprocess with an argument list instead.
              metadata:
                category: security
                cwe: "CWE-78"
              patterns:
                - pattern: os.system(...)

            - id: python-yaml-unsafe-load
              languages: [python]
              severity: ERROR
              message: >-
                yaml.load without SafeLoader can construct arbitrary Python objects.
                Use yaml.safe_load() or Loader=yaml.SafeLoader.
              metadata:
                category: security
                cwe: "CWE-502: Deserialization of Untrusted Data"
              patterns:
                - pattern: yaml.load($X)

            - id: python-pickle-loads
              languages: [python]
              severity: ERROR
              message: >-
                pickle deserialization of untrusted data enables arbitrary code execution.
                Use a safe format (JSON) for untrusted input.
              metadata:
                category: security
                cwe: "CWE-502"
              patterns:
                - pattern-either:
                    - pattern: pickle.loads(...)
                    - pattern: pickle.load(...)

            - id: python-weak-hash-md5-sha1
              languages: [python]
              severity: ERROR
              message: >-
                Weak hash algorithm (md5/sha1) used. For security contexts use sha256+.
                If non-security (e.g. content hashing), pass usedforsecurity=False.
              metadata:
                category: security
                cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
              patterns:
                - pattern-either:
                    - pattern: hashlib.md5($X)
                    - pattern: hashlib.sha1($X)

            - id: python-requests-verify-false
              languages: [python]
              severity: ERROR
              message: >-
                TLS certificate verification disabled (verify=False). This permits
                man-in-the-middle attacks. Keep verification enabled.
              metadata:
                category: security
                cwe: "CWE-295: Improper Certificate Validation"
              patterns:
                - pattern: requests.$F(..., verify=False, ...)

            - id: python-jwt-decode-verify-false
              languages: [python]
              severity: ERROR
              message: >-
                JWT decoded with signature verification disabled. Always verify signatures
                on tokens you did not just mint.
              metadata:
                category: security
                cwe: "CWE-347: Improper Verification of Cryptographic Signature"
              patterns:
                - pattern: jwt.decode(..., verify=False, ...)
          QZP_EMBED_opengrep_python_security
          echo "materialized $(find "${RUNNER_TEMP}/qzp-lean-gate/opengrep-default" -name '*.yaml' | wc -l) default ruleset file(s)"

      # ── GATE 1 (ts/js) — SELF-CONTAINED lint + format (Oxlint + Biome) ───────
      # GAP 2 FIX — the lean charter's gate-1 for ts/js runs SELF-CONTAINED in THIS
      # workflow (the Reframe pattern), NOT the caller's ad-hoc eslint. A caller
      # .pre-commit-config.yaml that contains a repo-LOCAL `frontend-eslint`-style
      # hook shelling out to a not-yet-installed tool ("sh: 1: eslint: not found",
      # exit 127) used to short-circuit the whole gate-1 step (observed:
      # momentstudio). We therefore run the workflow's OWN pinned linter + formatter
      # over the caller's ts/js directly, independent of the caller's local hooks.
      # They need nothing from the caller (npx fetches the pinned CLIs).
      #
      # round-3 FIX 1 — FORMATTER SWAP (decided design): the format check is now
      # BIOME (formatter-only; linting stays with Oxlint), mirroring the PROVEN
      # Reframe lean gate (Prekzursil/Reframe .github/workflows/quality.yml +
      # biome.json: biome 2.5.15, `formatter.enabled`, `linter.enabled:false`,
      # `assist.enabled:false`). `biome ci --formatter-enabled --linter-enabled=false
      # --assist-enabled=false` is check-only (no writes) and exits non-zero on any
      # unformatted file. If the caller ships its OWN biome.json/biome.jsonc we honor
      # it (biome auto-discovers it from cwd); otherwise we point biome at the
      # template's bundled minimal config (docs/lean-gate/biome.template.json, the
      # same style as Reframe's: 2-space, single quotes, trailingCommas all,
      # semicolons always, lineWidth 100, lf) via --config-path so formatting is
      # deterministic across callers. Oxlint linting is unchanged. Pins: oxlint
      # 1.69.0 (mirrors Reframe); biome is the literal below, which must equal
      # .quality/tool-pins.yml (bump both together). Keep in sync with
      # docs/lean-gate/pre-commit-config.template.yaml + docs/lean-gate/biome.template.json.
      - name: gate-lint-format-jsts (self-contained oxlint + biome)
        id: lint_jsts
        if: steps.detect.outputs.jsts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::oxlint@1.69.0 (--deny-warnings)"
          # --no-error-on-unmatched-pattern: when a caller has NO first-party
          # lintable JS (everything ignored/vendored), oxlint otherwise exits 1
          # with "No files found to lint" — a false FAIL. With the flag, an empty
          # match set exits 0 (PASS). This does NOT weaken the gate: when lintable
          # JS exists, --deny-warnings still runs and still fails on any warning.
          # **/*.min.js (and node_modules above) are obvious build artifacts that
          # must never be linted; real source is NOT broadly ignored.
          npx --yes oxlint@1.69.0 --deny-warnings \
            --no-error-on-unmatched-pattern \
            --ignore-pattern '**/node_modules/**' \
            --ignore-pattern '**/dist/**' \
            --ignore-pattern '**/build/**' \
            --ignore-pattern '**/out/**' \
            --ignore-pattern '**/.venv/**' \
            --ignore-pattern '**/vendor/**' \
            --ignore-pattern '**/*.min.js' \
            .
          echo "::endgroup::"
          # round-10: the biome pin is a LITERAL again. round-9 read it at
          # runtime from .quality/tool-pins.yml on this repo's `main`, which
          # meant a caller pinned to a workflow SHA still ran whatever biome
          # version `main` named on the day of the run: the SHA pin stopped
          # pinning the formatter. The literal is kept equal to tool-pins.yml by
          # tests/test_workflow_contracts.py and by fleet-health's weekly
          # pin-drift check, so the pin file stays the single source of truth
          # without making the gate mutable.
          biome_pin="2.5.15"
          echo "biome pin: $biome_pin (literal; equal to .quality/tool-pins.yml at this ref)"
          echo "::group::biome@${biome_pin} (format --check, formatter-only)"
          # Honor a caller-shipped biome config if present (biome auto-discovers
          # biome.json/biome.jsonc from cwd); otherwise use the template's bundled
          # minimal config so formatting is deterministic across callers.
          biome_cfg_args=()
          if [ ! -f biome.json ] && [ ! -f biome.jsonc ]; then
            tmp_biome_dir="$(mktemp -d)"
            # Bundled minimal config (single-line printf to avoid any YAML/heredoc
            # indentation pitfalls). Mirrors Reframe's biome.json style.
            # NB: NO "vcs.useIgnoreFile" here — biome errors ("couldn't find an
            # ignore file") on a caller without a .gitignore; we exclude vendored
            # trees explicitly via files.includes negations instead. The config dir
            # is a mktemp dir OUTSIDE the scanned tree, so biome does not treat it
            # as a "nested root configuration".
            printf '%s' '{"$schema":"https://biomejs.dev/schemas/2.5.15/schema.json","files":{"includes":["**/*.ts","**/*.tsx","**/*.js","**/*.jsx","**/*.mjs","**/*.cjs","!**/node_modules/**","!**/dist/**","!**/build/**","!**/out/**","!**/.venv/**","!**/vendor/**"]},"formatter":{"enabled":true,"indentStyle":"space","indentWidth":2,"lineWidth":100,"lineEnding":"lf"},"javascript":{"formatter":{"quoteStyle":"single","trailingCommas":"all","semicolons":"always"}},"linter":{"enabled":false},"assist":{"enabled":false}}' > "$tmp_biome_dir/biome.json"
            biome_cfg_args=(--config-path "$tmp_biome_dir")
            echo "No caller biome.json/biome.jsonc - using the lean template's bundled biome config."
          else
            echo "Honoring caller-shipped biome config."
          fi
          # `biome ci` is the non-mutating check command; restrict it to the
          # formatter (linting is Oxlint's job, assist disabled).
          npx --yes "@biomejs/biome@${biome_pin}" ci \
            --formatter-enabled=true --linter-enabled=false --assist-enabled=false \
            "${biome_cfg_args[@]}" . || {
            echo "FAIL gate-lint-format-jsts: biome found unformatted ts/js (run 'npx --yes @biomejs/biome@${biome_pin} format --write' / the biome pre-commit hook to fix)." >&2
            echo "FAIL gate-lint-format-jsts: NOTE the format check covers CONFIG FILES TOO, including biome.json itself - a hand-edited unformatted biome.json fails here exactly like source." >&2
            exit 1
          }
          echo "::endgroup::"

      # ── GATE 1 (py) — SELF-CONTAINED lint + format (Ruff) ───────────────────
      # round-6 FIX — the lean charter's Python lint/format runs the workflow's OWN
      # pinned ruff directly, NOT the caller's `.pre-commit-config.yaml`. The old
      # `gate-lint-format-secrets` step ran `pre-commit run --all-files`, which
      # dragged in each repo's BESPOKE pre-commit env (a root npm lockfile for the
      # frontend-eslint hook's `npm ci`, the .NET SDK for dotnet-format, caller-
      # local eslint/tsc/prettier, ...) and red-failed for caller-ENVIRONMENT
      # reasons even when the repo's real lean quality was fine. We now run ruff
      # ourselves: `ruff check` (lint) + `ruff format --check` (format), honoring a
      # caller [tool.ruff] in pyproject.toml or a ruff.toml/.ruff.toml when present
      # (ruff auto-discovers it from cwd); otherwise ruff's own defaults apply.
      # This is NOT weakening — ruff is the SAME charter tool the pre-commit hook
      # ran (pinned to Reframe's ruff 0.15.17); ruff lint issues or unformatted
      # Python still FAIL. Pin: ruff 0.15.17 (mirrors Reframe). Keep in sync with
      # docs/lean-gate/pre-commit-config.template.yaml.
      - name: gate-lint-format-py (self-contained ruff)
        id: lint_py
        if: steps.detect.outputs.python == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::ruff check (lint)"
          # --output-format=github surfaces findings as GH annotations. ruff honors
          # a caller [tool.ruff]/ruff.toml automatically (cwd discovery); no caller
          # pre-commit/eslint/SDK environment is touched.
          ruff check --output-format=github .
          echo "::endgroup::"
          echo "::group::ruff format --check"
          ruff format --check . || {
            echo "FAIL gate-lint-format-py: ruff found unformatted Python (run 'ruff format' / the ruff pre-commit hook to fix)." >&2
            exit 1
          }
          echo "::endgroup::"

      # ── GATE 2 — types ────────────────────────────────────────────────────
      # tsc per tsconfig.json so monorepo / nested-project shapes (e.g. an `ui/`
      # subproject with its own tsconfig and no root tsconfig — event-link) are
      # type-checked instead of hard-failing. Root tsconfig => `tsc --noEmit`;
      # otherwise discover every nested tsconfig and run `tsc -p <dir> --noEmit`.
      # Each project's deps are installed from its own package.json when present.
      - name: gate-types tsc
        id: types_tsc
        if: steps.detect.outputs.ts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install_deps() { # $1 = dir containing package.json
            if [ -f "$1/package.json" ]; then
              ( cd "$1" && { npm ci || npm install; } )
            fi
          }
          if [ -f tsconfig.json ]; then
            install_deps .
            npx --yes tsc --noEmit
          else
            # No root tsconfig — discover nested project configs (excluding vendored trees).
            mapfile -t configs < <(git ls-files '**/tsconfig.json' tsconfig*.json \
              | grep -Ev '(^|/)(node_modules|dist|out|build|\.venv)/' || true)
            if [ "${#configs[@]}" -eq 0 ]; then
              echo "ts/tsx present but no tsconfig.json (root or nested) - nothing for tsc to check."
              exit 0
            fi
            for cfg in "${configs[@]}"; do
              dir="$(dirname "$cfg")"
              echo "::group::tsc -p $cfg"
              install_deps "$dir"
              ( cd "$dir" && npx --yes tsc -p "$(basename "$cfg")" --noEmit )
              echo "::endgroup::"
            done
          fi

      # round-5 FIX A — basedpyright at the STANDARD bar (consistency with Reframe).
      # basedpyright's DEFAULT mode is stricter than upstream pyright: it turns on
      # reportAny / reportUnknown* / reportUnusedCallResult, which flood untyped
      # utility scripts with thousands of non-bug "errors" (observed: momentstudio
      # 2774, swfoc 39, pbinfo 11 — all from scripts/utils). Reframe runs basedpyright
      # at typeCheckingMode = "standard" via [tool.basedpyright]. So: if the CALLER
      # ships a basedpyright/pyright config (pyrightconfig.json, basedpyrightconfig.json,
      # or a pyproject.toml with a [tool.(based)pyright] table) we honor it verbatim
      # (run basedpyright as-is); otherwise we pass `--typecheckingmode standard` so
      # the gate uses the proven standard bar instead of basedpyright's stricter
      # default. This is NOT weakening — standard is the proven bar and reportAny-
      # everywhere is gold-plating; REAL type errors at standard level still FAIL.
      - name: gate-types basedpyright
        id: types_py
        if: steps.detect.outputs.python == 'true'
        shell: bash
        env:
          PYRIGHTCFG: ${{ steps.detect.outputs.pyrightcfg }}
        run: |
          set -euo pipefail
          if [ "$PYRIGHTCFG" = "true" ]; then
            echo "Honoring caller-shipped basedpyright/pyright config (running as-is)."
            basedpyright
          else
            echo "No caller basedpyright/pyright config - using standard typeCheckingMode (mirrors Reframe)."
            basedpyright --typecheckingmode standard
          fi

      # ── GATE 3 — tests + coverage (STRICT 100% line+branch) ───────────────
      # Python via coverage.py; JS/TS via the caller's `test:coverage` script.
      # SILENT-PASS HOLE CLOSED: the old guard `&& hashFiles(pyproject/setup.cfg/
      # tox.ini)` let a Python repo with code but no coverage config pass GREEN
      # without ever measuring coverage. Now: if Python source exists we ALWAYS
      # measure. The ONLY skip is the documented narrow case — Python source with
      # ZERO test files (no tests, no coverage config) = "no test surface by
      # design". Source + tests but no cov config (or source + cov config) => FAIL
      # unless 100%. The 100% gate cannot pass unmeasured.
      - name: gate-tests-coverage python
        id: cov_py
        if: steps.detect.outputs.python == 'true'
        shell: bash
        env:
          PYCOVCFG: ${{ steps.detect.outputs.pycovcfg }}
          PYTESTS: ${{ steps.detect.outputs.pytests }}
        run: |
          set -euo pipefail
          if [ "$PYCOVCFG" != "true" ] && [ "$PYTESTS" != "true" ]; then
            echo "Python source present with NO test files and NO coverage config - no test surface by design; coverage lane skipped."
            echo "result=no-test-surface" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PYCOVCFG" != "true" ] && [ "$PYTESTS" == "true" ]; then
            echo "FAIL gate-tests-coverage python: Python source + tests are present but no coverage config (pyproject.toml/setup.cfg/tox.ini/.coveragerc/pytest.ini) - the 100% gate cannot pass unmeasured. Add coverage config." >&2
            echo "FAIL gate-tests-coverage python: the bar is 100% LINE **AND** BRANCH - line-only 100% typically sits at ~99.x once branches are counted and still FAILs; this lane always passes --cov-branch." >&2
            exit 1
          fi
          # The caller's runtime deps were installed before gate 2 (step
          # "Install the caller's Python runtime dependencies"), so the tests
          # below import exactly what the type check resolved against.
          # round-10: the measuring tools are PINNED (equal to
          # .quality/tool-pins.yml). They used to be installed unpinned, so the
          # tool that decides this gate changed under every caller whenever PyPI
          # published a release, whatever ref the caller pinned.
          if grep -rqs 'pytest' pyproject.toml setup.cfg tox.ini pytest.ini 2>/dev/null; then
            pip install pytest==9.1.1 pytest-cov==7.1.0 coverage==7.16.2
            python -m pytest --cov --cov-branch --cov-fail-under=100
          else
            pip install coverage==7.16.2
            # round-10: --branch. This path measured LINES ONLY while the
            # failure message above promised line AND branch, so a unittest
            # repo could pass at 100% lines with untested branches.
            # A tests/ directory without __init__.py is not importable as a
            # package, so a root `discover` never enters it. Both trees are
            # therefore discovered - the root (packages and root-level test
            # modules) AND tests/ - each in its own parallel coverage run,
            # combined before the report. unittest exits 5 when a pass finds
            # NO tests; that is fine for one pass, never for both.
            declare -a starts=(.)
            if [ -d tests ] && [ ! -f tests/__init__.py ]; then
              starts+=(tests)
            fi
            rm -f .coverage .coverage.*
            ran_tests=false
            for start in "${starts[@]}"; do
              echo "::group::unittest discover -s $start"
              rc=0
              python -m coverage run --branch --parallel-mode -m unittest discover -s "$start" || rc=$?
              echo "::endgroup::"
              case "$rc" in
                0) ran_tests=true ;;
                5) echo "unittest discover -s $start: no tests there." ;;
                *) echo "FAIL gate-tests-coverage python: the tests discovered from '$start' failed (exit $rc)." >&2; exit 1 ;;
              esac
            done
            if [ "$ran_tests" != "true" ]; then
              echo "FAIL gate-tests-coverage python: test files are present but unittest discovered and ran NONE of them (searched: ${starts[*]}). The 100% gate cannot pass unmeasured." >&2
              exit 1
            fi
            python -m coverage combine
            python -m coverage report --fail-under=100 --show-missing
          fi

      # SILENT-PASS HOLE CLOSED: the old else-branch printed a message and passed
      # GREEN when ts/js source existed but no `test:coverage` script — code with
      # zero measured coverage slipped through the 100% gate. Now: if a coverage
      # script (or vitest/jest coverage equivalent) is present we run it; if ts/js
      # source + tests exist but no coverage script => FAIL. The ONLY skip is the
      # documented narrow case — ts/js source with ZERO test files = "no test
      # surface by design". A ts/js repo with code + tests but no coverage script
      # must NOT pass unmeasured.
      #
      # round-3 FIX 5 — NESTED-MONOREPO DISCOVERY: the coverage lane used to inspect
      # ONLY the ROOT package.json, so a nested project (the package.json lives in a
      # subdir, root has none — observed: webcoder, package.json in frontend/
      # webcoder_ui) hard-FAILED "no coverage script" even though the nested project
      # has one. Mirror the tsc lane (round-1 FIX): if there is a root package.json
      # use it; otherwise DISCOVER every nested package.json (excluding vendored
      # trees) and run coverage in each project dir that has a coverage script /
      # vitest|jest --coverage test script. The only skip is the documented
      # "no test surface by design" (zero ts/js test files).
      #
      # round-10 FIX — the "root OR nested" choice above was itself a hole: with
      # a root package.json, nested projects were never measured, and a nested
      # project with test files but NO coverage runner passed silently. Every
      # project is now planned (root first, then nested) and any project with
      # JS/TS test files and no coverage lane FAILS, unless it is a workspace
      # member of a measured root.
      #
      # round-7 FIX — ASSERT THE NUMBER. This lane used to run the caller's
      # coverage script and pass on exit 0, passing NO threshold and checking NO
      # number: enforcement was delegated entirely to the caller's vitest/karma
      # config and the gate never verified one existed. Measured 2026-08-11,
      # momentstudio's frontend printed `Statements : 49.57%` and the lane
      # printed `PASS gate-tests-coverage jsts`. The run's output is now captured
      # and the summary it produced is parsed and compared. A run that yields NO
      # parseable summary FAILS — that property is unconditional and cannot be
      # switched off by `jsts-coverage-min`, which only moves the numeric bar and
      # is itself rejected outside (0, 100].
      - name: gate-tests-coverage jsts
        id: cov_jsts
        if: steps.detect.outputs.jsts == 'true'
        shell: bash
        env:
          JSTS_COVERAGE_MIN: ${{ inputs.jsts-coverage-min }}
        run: |
          set -euo pipefail
          # has_cov_lane: does <dir>/package.json define a runnable coverage lane?
          # Echoes "script" (test:coverage) | "runner" (vitest/jest --coverage in
          # `test`) | "" (none). Reads only that dir's package.json.
          has_cov_lane() {
            # NB: node's require() treats a bare path ('dir/package.json') as a
            # MODULE lookup, not a relative file - it MUST be './'-prefixed. With
            # d='.' this yields './././package.json' (valid); with a nested dir it
            # yields './frontend/ui/package.json' (valid).
            local d="./$1"
            if node -e "process.exit((require('$d/package.json').scripts||{})['test:coverage']?0:1)" 2>/dev/null; then
              echo "script"; return 0
            fi
            if node -e "const s=(require('$d/package.json').scripts||{}).test||'';process.exit(/(vitest|jest).*--coverage|--coverage.*(vitest|jest)/.test(s)?0:1)" 2>/dev/null; then
              echo "runner"; return 0
            fi
            echo ""; return 0
          }
          run_cov_in_dir() { # $1 dir, $2 lane-kind
            local slug log
            slug="$(printf '%s' "$1" | tr -c 'A-Za-z0-9' '_')"
            log="${RUNNER_TEMP}/qzp-lean-gate/jsts-coverage-${slug}.log"
            echo "::group::coverage in $1 ($2)"
            # Reports are read from <dir>/coverage below, so clear it first: a
            # committed or cached report must never stand in for this run's.
            rm -rf -- "$1/coverage"
            # `tee` keeps the run visible in the job log while capturing the
            # printed coverage summary, which is the last-resort evidence when a
            # project ships no machine-readable reporter. pipefail is already on,
            # so a failing coverage script still reds the lane through the pipe.
            ( cd "$1" && { npm ci || npm install; } \
              && if [ "$2" = "script" ]; then npm run test:coverage; else npm test; fi ) 2>&1 | tee "$log"
            echo "::endgroup::"
            # THE number check. Exit 0 from the caller's script is not evidence
            # of coverage; a parsed figure at or above the bar is.
            python3 "${RUNNER_TEMP}/qzp-lean-gate/jsts_coverage_assert.py" \
              --project-dir "$1" --log "$log" --min-percent "$JSTS_COVERAGE_MIN"
          }
          # round-10: EVERY project is planned, root AND nested. The lane used
          # to measure only the root whenever a root package.json existed, so a
          # nested project's coverage was never run and a nested project with
          # tests but no coverage lane was never flagged. The planner (embedded
          # jsts_projects.py) attributes each JS/TS test file to its deepest
          # enclosing project and marks the root's workspace members. The plan
          # is written to a file first so a planner failure fails this step
          # (a process substitution would swallow its exit status). `-z` keeps
          # non-ASCII paths unquoted, so they still match their project.
          files_list="${RUNNER_TEMP}/qzp-lean-gate/jsts-files.txt"
          plan_file="${RUNNER_TEMP}/qzp-lean-gate/jsts-plan.tsv"
          orphans_file="${RUNNER_TEMP}/qzp-lean-gate/jsts-orphans.txt"
          git ls-files -z > "$files_list"
          plan_args=(--files "$files_list" --orphans-out "$orphans_file")
          if [ -f package.json ]; then plan_args+=(--root-package-json package.json); fi
          if [ -f pnpm-workspace.yaml ]; then plan_args+=(--pnpm-workspace pnpm-workspace.yaml); fi
          python3 "${RUNNER_TEMP}/qzp-lean-gate/jsts_projects.py" "${plan_args[@]}" > "$plan_file"
          mapfile -t plan < "$plan_file"
          mapfile -t orphans < "$orphans_file"
          measured=0
          declare -a unmeasured=()
          for row in "${plan[@]}"; do
            # tolerate a CRLF plan (python3 on a Windows runner writes one)
            IFS=$'\t' read -r d has_tests member <<< "${row%$'\r'}"
            lane="$(has_cov_lane "$d")"
            if [ -n "$lane" ]; then
              # A DECLARED coverage lane always runs: the owner asked for this
              # project to be measured, and no file-name heuristic may decide
              # that a runner has nothing to run (Cypress `*.cy.ts`, Mocha
              # `test/`, node:test... all have their own conventions). A
              # declared script that cannot run is a red the owner can fix.
              run_cov_in_dir "$d" "$lane"
              measured=$(( measured + 1 ))
            elif [ "$has_tests" != "yes" ]; then
              # No lane and no test files of its own (an aggregator root, a
              # tooling package): nothing to measure here.
              echo "project $d: no coverage lane and no JS/TS test files of its own - nothing to measure."
            elif [ "$member" = "yes" ]; then
              # A root workspace run can cover a member's code without ever
              # running the member's tests (a root `jest src --coverage` that
              # imports it), so it is never accepted in place of a lane.
              unmeasured+=("$d (workspace member)")
            else
              unmeasured+=("$d")
            fi
          done
          if [ "${#orphans[@]}" -gt 0 ]; then
            echo "FAIL gate-tests-coverage jsts: these JS/TS test files sit outside every package.json project, so no coverage lane ever runs them: ${orphans[*]}. Move them under a project whose coverage script runs them." >&2
            exit 1
          fi
          if [ "${#unmeasured[@]}" -gt 0 ]; then
            echo "FAIL gate-tests-coverage jsts: these project dir(s) have JS/TS test files but no coverage lane of their own, so their tests never ran under a measured coverage run - never measured: ${unmeasured[*]}. Add a 'test:coverage' npm script (or a vitest/jest '--coverage' test script) to each project's package.json; a root workspace run does not count for a member, because it can cover the member's code without running the member's tests." >&2
            exit 1
          fi
          # Every JS/TS test file is now accounted for: inside a measured
          # project, an unmeasured project (failed above) or an orphan (failed
          # above). Nothing measured therefore means there is no JS/TS test
          # file at all.
          if [ "$measured" -gt 0 ]; then
            echo "PASS gate-tests-coverage jsts: measured coverage in ${measured} project dir(s) and every measured figure met the ${JSTS_COVERAGE_MIN}% bar."
          else
            echo "ts/js source present with NO JS/TS test files - no test surface by design; coverage lane skipped."
            echo "result=no-test-surface" >> "$GITHUB_OUTPUT"
          fi

      # ── GATE 3 (go / c++) — tests + coverage via the CALLER's own gate ────
      # ROUND-7 REGRESSION FIX. round-6 removed the caller pre-commit run and the
      # per-language toolchains, which together were the ONLY path by which a
      # compiled language reached gate 3. Both compiled languages then fell
      # through to the narrow "no test surface by design" skip and the step
      # reported SUCCESS. Measured on the live fleet:
      #   * DevExtreme-Filter-Go-Language — 236,928 bytes of Go, 30+ root-level
      #     *_test.go files, and a .pre-commit-config.yaml whose gate-3 hook
      #     `go-test-cover-100` runs exactly `bash scripts/coverage-gate.sh`.
      #     Its own config header still names reusable-quality.yml as the
      #     entrypoint for that hook. Coverage: never measured, always green.
      #   * Airline-Reservations-System — 166,743 bytes of C/C++ across 32
      #     files (32.6% of source bytes) with 11 *_test.cpp files under
      #     tests/ and no lane of any kind.
      #
      # WHY THE CALLER'S SCRIPT AND NOT A DIRECT LANE: the Go coverage gate
      # already EXISTS in the caller repo — the pre-commit hook is a thin
      # wrapper around `bash scripts/coverage-gate.sh`. Running that script
      # directly is strictly more robust than restoring `pre-commit run
      # --all-files`: it needs no pre-commit install, no caller hook
      # environment, and it CANNOT drag in the bespoke frontend-eslint /
      # dotnet-format hooks that round-6 removed for good reason. For C++ there
      # is no safely auto-configurable instrumented build (the workflow cannot
      # know the build system, the flags, or how to add --coverage), so a blind
      # clang-tidy+gcovr lane would be a gate the owner could not drive to
      # green. Deliberately NOT added here: golangci-lint and go vet. Those are
      # gate-1/gate-2 concerns, they are autofixer-class red, and this commit is
      # scoped to closing the measured coverage hole.
      #
      # The skip stays reachable ONLY for its documented narrow case (source
      # present, ZERO test files). With test files present this lane can no
      # longer skip — proven behaviourally, not by text assertion, in
      # tests/test_lean_gate_compiled_coverage_lane.py, which extracts this very
      # script and executes it across the whole truth table.
      - name: gate-tests-coverage compiled (go / c++)
        id: cov_compiled
        if: steps.detect.outputs.go == 'true' || steps.detect.outputs.cpp == 'true'
        shell: bash
        env:
          GO_PRESENT: ${{ steps.detect.outputs.go }}
          GO_TESTS: ${{ steps.detect.outputs.gotests }}
          GO_MOD: ${{ steps.detect.outputs.gomod }}
          CPP_PRESENT: ${{ steps.detect.outputs.cpp }}
          CPP_TESTS: ${{ steps.detect.outputs.cpptests }}
          COVERAGE_GATE_SCRIPT: ${{ inputs.coverage-gate-script }}
        run: |
          set -euo pipefail
          # Which compiled languages have a DEMONSTRABLE test surface. Built with
          # explicit `if` blocks, not `[ ... ] && ...` chains: under `set -e` a
          # false test at the end of a chain aborts the whole step.
          needs=""
          if [ "$GO_PRESENT" = "true" ] && [ "$GO_TESTS" = "true" ]; then
            needs="go"
          fi
          if [ "$CPP_PRESENT" = "true" ] && [ "$CPP_TESTS" = "true" ]; then
            needs="${needs:+$needs+}c++"
          fi

          if [ -z "$needs" ]; then
            echo "Compiled source present (go=$GO_PRESENT c++=$CPP_PRESENT) with ZERO test files - no test surface by design; coverage lane skipped."
            echo "result=no-test-surface" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Compiled test surface DETECTED ($needs). This lane CANNOT skip: the 100% gate cannot pass unmeasured."

          # Go needs a toolchain, and the toolchain step keys off a root go.mod.
          # Go tests with no go.mod is a real hole, not a design decision.
          case "$needs" in
            *go*)
              if [ "$GO_MOD" != "true" ]; then
                echo "FAIL gate-tests-coverage ($needs): *_test.go files exist but there is no root go.mod, so no Go toolchain was set up and coverage cannot be measured. Add a root go.mod (or move the module to the repo root)." >&2
                exit 1
              fi
              go version
              ;;
          esac

          # ONE invocation even for a mixed go+c++ repo: the caller's script is
          # the repo's whole compiled-language coverage gate, not a per-language
          # one, so running it twice would only burn runner minutes.
          if [ ! -f "$COVERAGE_GATE_SCRIPT" ]; then
            echo "FAIL gate-tests-coverage ($needs): this repo has compiled-language test files but no coverage gate at '$COVERAGE_GATE_SCRIPT', so the STRICT 100% gate cannot pass unmeasured." >&2
            echo "FAIL gate-tests-coverage ($needs): remediation - add an executable 'scripts/coverage-gate.sh' that runs the tests, measures coverage and exits non-zero below the bar (for Go: 'go test -covermode=atomic -coverprofile=... ./...' then 'go tool cover -func'), or point the 'coverage-gate-script' workflow input at the script you already have." >&2
            exit 1
          fi

          echo "::group::bash $COVERAGE_GATE_SCRIPT ($needs)"
          bash "$COVERAGE_GATE_SCRIPT"
          echo "::endgroup::"
          echo "PASS gate-tests-coverage ($needs): the caller's own coverage gate '$COVERAGE_GATE_SCRIPT' measured the tests and passed."

      # ── GATE 4 — SAST (opengrep, curated ruleset, clean-zero) ─────────────
      # round-10: ALWAYS runs. The caller's .quality/opengrep ruleset when it
      # exists, otherwise the platform default ruleset materialized above.
      - name: gate-sast opengrep
        id: sast
        shell: bash
        env:
          OPENGREP_PATHS: ${{ inputs.opengrep-paths }}
          OPENGREP_CALLER_RULESET: ${{ steps.detect.outputs.opengrepcfg }}
        run: |
          # OPENGREP_PATHS is an optional space-separated list of scan paths.
          # Passed via env (NOT an inline GHA expression in this run block) to
          # avoid GitHub Actions run-step expression injection -- note that GHA
          # expands expression tokens textually over the whole run string,
          # comments included, so even a literal token here is a real sink.
          # The value is then split into a bash ARRAY so each path is a
          # distinct argument WITHOUT an unquoted expansion (an unquoted $VAR of an
          # injectable input still trips CodeQL actions/code-injection). Empty
          # value => zero extra args (default = scan repo root via the config).
          # round-8 FIX — THE SCANNED FILE SET WAS INHERITED, NOT CHOSEN.
          #
          # With NO `.semgrepignore` in the scanned root the engine falls back
          # to a BUILT-IN ignore template that drops test code. Nobody in this
          # fleet picked that. Measured 2026-08-11 against the PINNED engine
          # (opengrep v1.22.0 CLI on Linux, exactly the build installed above),
          # controlled detector, one variable at a time:
          #
          #   src/inline.go    `db.Query(fmt.Sprintf(...))`      -> FIRES
          #   tests/inline.go  byte-identical to the line above  -> SILENT
          #
          # and `paths.skipped` reported `none` while it happened, so nothing in
          # this gate's output revealed it. Pointing the scanner directly at
          # `tests/` returns `paths.scanned: []`, so an explicit path argument
          # does NOT override it either.
          #
          # The dropped set, enumerated one identical vulnerable file per
          # candidate path: `*_test.go` AT ANY DEPTH, plus the `test/` and
          # `tests/` directories. Python/TS test FILENAMES (`test_app.py`,
          # `app.test.ts`, `app.spec.ts`, `__tests__/`) are NOT excluded -- only
          # the two directories are. That asymmetry is why a Go repo following
          # the language's own `foo_test.go` convention loses its ENTIRE suite
          # regardless of layout: DevExtreme-Filter-Go-Language lost 49 files.
          #
          # DO NOT "fix" this with `--semgrepignore-filename`: opengrep v1.22.0
          # DOCUMENTS that option in `opengrep scan --help` (line 405) but its
          # parser REJECTS it -- exit 2, "No such option", verified against a
          # known-fake flag as a control. Passing it would break gate 4 on every
          # caller at once. `--x-ignore-semgrepignore-files` does restore the
          # test tree, but it discards ANY `.semgrepignore` the caller wrote,
          # which would silently undo their deliberate exclusions. The only
          # correct fix is a per-repo file: see
          # docs/lean-gate/semgrepignore.template.
          #
          # This WARNS and never blocks (charter: additive-only, and green must
          # stay reachable by an owner-controlled action). Measured blast radius
          # of adopting the template, per caller with its own opengrep-paths:
          # +49 newly-visible files in DevExtreme-Filter-Go-Language (its whole
          # `_test.go` suite) and ZERO new findings in 10 of 11 public repos.
          if [ ! -f .semgrepignore ]; then
            echo "::warning title=gate-sast scan set is inherited::No .semgrepignore in the repo root, so opengrep falls back to its built-in template and SILENTLY skips every *_test.go at any depth plus the test/ and tests/ directories, while paths.skipped still reports 'none'. Copy docs/lean-gate/semgrepignore.template from quality-zero-platform to .semgrepignore to choose the scanned set deliberately."
          fi
          # round-10: the RULESET is chosen, never the decision to scan. A repo
          # without .quality/opengrep used to skip this gate entirely and still
          # report green; it is now scanned with the platform default ruleset
          # (the same curated rules quality-zero-platform holds itself to),
          # materialized above at the ref the caller pinned.
          if [ "$OPENGREP_CALLER_RULESET" = "true" ]; then
            ruleset_dir=.quality/opengrep
            echo "Scanning with the repo's own curated ruleset (.quality/opengrep)."
          else
            ruleset_dir="${RUNNER_TEMP}/qzp-lean-gate/opengrep-default"
            echo "::notice title=gate-sast platform default ruleset::This repo has no .quality/opengrep ruleset, so gate 4 scans with quality-zero-platform's curated default ruleset. Add .quality/opengrep/ to extend or replace it."
          fi
          read -ra opengrep_paths <<< "$OPENGREP_PATHS"
          opengrep scan --config "$ruleset_dir" --error \
            --exclude .venv --exclude node_modules --exclude dist --exclude out --exclude build \
            "${opengrep_paths[@]}"

      # ── GATE 5 — secrets, gitleaks (0 findings) ──────────────────────────
      # round-6 made gitleaks self-contained (no caller pre-commit) but kept its
      # trigger as "a .gitleaks.toml exists".
      #
      # round-7 FIX — THAT TRIGGER WAS INVERTED. `.gitleaks.toml` is an
      # ALLOWLIST, so the presence of "things we have decided to ignore" was the
      # opt-in signal for secret scanning: a repo that had never needed an
      # allowlist — a clean repo, or a brand-new adopter — got NO secret
      # scanning at all. Secret scanning is T0 absolute-zero. It now runs
      # ALWAYS, and the allowlist is an optional input to the scan rather than a
      # guard on it.
      #
      # Blast radius, measured live 2026-08-11 against the contents API (with
      # quality-zero-platform's own 404 as the detector control): all 14
      # governed repos shipping a `quality.yml` that calls this workflow ALREADY
      # have a `.gitleaks.toml`, so this changes nothing for today's callers. It
      # closes the hole for the next one. Green stays reachable by an
      # owner-controlled action: fix the secret, or add an allowlist entry.
      #
      # Pin: gitleaks 8.30.1 (mirrors Reframe), installed above. Note the
      # checkout above is shallow (fetch-depth 1), so `gitleaks detect` scans
      # effectively the checked-out tree rather than the whole history.
      - name: gate-secrets gitleaks (self-contained)
        id: secrets
        shell: bash
        env:
          GITLEAKS_ALLOWLIST: ${{ steps.detect.outputs.gitleaksallowlist }}
        run: |
          set -euo pipefail
          # --redact is non-negotiable: a finding must never echo the secret
          # itself into a job log that may be public.
          # --verbose prints each finding's rule, file and line (the secret
          # itself stays REDACTED), so a red gate says what to triage.
          args=(detect --no-banner --redact --verbose)
          if [ "$GITLEAKS_ALLOWLIST" = "true" ]; then
            echo "Honoring the caller's .gitleaks.toml allowlist."
            args+=(--config .gitleaks.toml)
          else
            echo "No .gitleaks.toml in this repo - scanning with the pinned gitleaks default ruleset. To triage a false positive, add a .gitleaks.toml allowlist."
          fi
          gitleaks "${args[@]}"

      # ── GATE 6 — deps (osv-scanner, 0 actionable CVEs) ───────────────────
      # osv-scanner exits 128 ("no package sources found") on a zero-dependency
      # repo. Round-1 added an `osvsources` pre-check (skip when no manifest glob
      # matched). Round-3 FIX 4: that pre-check alone was NOT enough — a repo can
      # match a manifest glob yet still have NOTHING osv-scanner recognizes as a
      # scannable package source (e.g. a `pom.xml`/`pyproject.toml` with no
      # resolvable deps, or only files osv treats as non-lockfiles), so the scanner
      # still exits 128 (observed fleet red: star-wars, a zero-dependency repo).
      # The authoritative "nothing to scan" signal is osv-scanner's OWN exit 128.
      #
      # Round-4: osv-scanner's exit codes are NOT a 0-vs-non-zero split. Verbatim
      # from cmd/osv-scanner/internal/cmd/run.go at the pinned tag v2.3.8:
      #     130 = HasErroredBecauseInvalidConfig()   (checked FIRST, takes priority)
      #       1 = ErrVulnerabilitiesFound            <- the ONLY vulnerability code
      #     128 = ErrNoPackagesFound                 <- nothing to scan
      #     129 = ErrAPIFailed                       <- OSV.dev API unreachable
      #     127 = HasErrored()                       <- generic "an error was logged"
      #       0 = success, no vulnerabilities
      # Round-3 mapped 128 -> PASS but funnelled EVERY other non-zero code into one
      # "FAIL gate-deps ... (vulnerabilities found or scanner error)" branch, so a
      # third-party outage was indistinguishable from a security regression.
      # Observed fleet red: momentstudio run 30144541486 (both attempts) printed
      # "FAIL gate-deps: osv-scanner exited 127" because the deps.dev gRPC resolver
      # was down for its Python manifests ("rpc error: code = Unavailable desc =
      # service unavailable"), while the scanner's own report in the same log said
      # "Total 0 packages affected by 0 known vulnerabilities".
      #
      # Measured with the pinned 2.3.8 binary: a tree holding BOTH a vulnerable
      # lockfile AND an unextractable one exits 1, not 127 — the switch returns on
      # ErrVulnerabilitiesFound before the HasErrored() check at run.go:113 is ever
      # reached. So exit 127 provably means "no vulnerability was detected in
      # whatever WAS scanned"; it cannot mask a finding the scanner actually made.
      # What it DOES leave unknown is the manifests that failed to resolve, so the
      # scan-error class still BLOCKS: an incomplete scan is not evidence of a
      # clean tree, and auto-passing it would fail open exactly where this gate
      # exists to fail closed. It is reported with an unmistakably different
      # message and its own exit code (75 = EX_TEMPFAIL, "temporary failure, retry
      # later") so it is never read — or dashboarded — as a CVE. Short transient
      # resolver blips are absorbed first by a bounded retry (3 attempts, 20s then
      # 40s backoff); 130 is deterministic so it is not retried. A prolonged
      # upstream outage is NOT a silent pass here either: this lean gate reads
      # no bypass labels, so the only way past it is a repository admin merging
      # through the ruleset bypass, which GitHub audits.
      #
      # round-10: this step used to run ONLY when the caller shipped an
      # osv-scanner.toml, so a repo that had never written one had NO dependency
      # gate while `quality` stayed green. It now ALWAYS runs, and the "is there
      # anything to scan" pre-check is gone too: its glob list missed sources
      # osv-scanner supports (bun.lock, uv.lock, NuGet, pubspec.lock, mix.lock
      # ...), turning them into a silent pass. Exit 128 above is the verdict.
      # The toml, when present, is passed as --config so the caller's
      # hand-written ignores still apply first. The blocking policy is the
      # `deps-severity-floor` input (validated before any gate ran).
      - name: gate-deps osv-scanner
        id: deps
        shell: bash
        env:
          OSVCONFIG: ${{ steps.detect.outputs.osvconfig }}
          DEPS_SEVERITY_FLOOR: ${{ inputs.deps-severity-floor }}
        run: |
          set -euo pipefail
          scan_args=(scan source --recursive)
          if [ "$OSVCONFIG" = "true" ]; then
            echo "Honoring the repo's osv-scanner.toml (its ignores apply before any finding is classified)."
            scan_args+=(--config=osv-scanner.toml)
          else
            echo "No osv-scanner.toml in this repo - scanning with osv-scanner's defaults (no ignores)."
          fi
          echo "Blocking policy (deps-severity-floor): $DEPS_SEVERITY_FLOOR"

          # "The scan itself did not complete" — none of these is a vuln finding.
          is_scan_error() { case "$1" in 127|129|130) return 0 ;; *) return 1 ;; esac; }
          # Of those, the ones a transient upstream outage produces. 130 (invalid
          # config) is deterministic, so retrying it only burns runner minutes.
          is_retryable() { case "$1" in 127|129) return 0 ;; *) return 1 ;; esac; }

          attempt=1
          max_attempts=3
          rc=0
          while : ; do
            rc=0
            osv-scanner "${scan_args[@]}" . || rc=$?
            if ! is_retryable "$rc" || [ "$attempt" -ge "$max_attempts" ]; then
              break
            fi
            backoff=$(( attempt * 20 ))
            echo "RETRY gate-deps: osv-scanner exited $rc without completing the scan (attempt ${attempt}/${max_attempts}) - this is NOT a vulnerability finding; retrying in ${backoff}s." >&2
            sleep "$backoff"
            attempt=$(( attempt + 1 ))
          done

          if [ "$rc" -eq 0 ]; then
            echo "PASS gate-deps: osv-scanner found 0 actionable CVEs."
          elif [ "$rc" -eq 128 ]; then
            echo "osv-scanner exited 128 (no package sources found) - nothing to scan; deps gate passes."
            echo "result=nothing-to-scan" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            # T0 SEVERITY FLOOR. Exit 1 means "at least one advisory matched" -
            # it says NOTHING about severity, dev/prod scope, or whether a fix
            # exists. Treating it as a blanket red is what blocked 22 of 34 open
            # fleet PRs on 2026-08-11, including DevExtreme PR #40 - itself a
            # security bump - stuck for 17 days behind an UNSCORED Go stdlib
            # advisory (max_severity "") that no change in that PR could clear.
            # So: re-read the SAME scan as JSON and let the classifier decide.
            # BLOCK = not dev-only AND CVSS >= 7.0 AND a fixed version exists;
            # everything else is printed as T2 inventory and does not block.
            # Note the re-scan uses the SAME scan_args, so a caller's
            # osv-scanner.toml ignores still apply first, unchanged.
            json_report="${RUNNER_TEMP}/qzp-lean-gate/osv-report.json"
            jrc=0
            osv-scanner "${scan_args[@]}" --format json . \
              > "$json_report" || jrc=$?
            # deps-severity-floor: any = ZERO TOLERANCE. osv-scanner already
            # proved at least one advisory matched (exit 1), so the verdict is
            # FAIL whatever the classifier says; it runs only so the reader sees
            # every finding, including the rows `t0` would have demoted.
            if [ "$DEPS_SEVERITY_FLOOR" = "any" ]; then
              if [ "$jrc" -eq 0 ] || [ "$jrc" -eq 1 ]; then
                python3 "${RUNNER_TEMP}/qzp-lean-gate/osv_severity_gate.py" "$json_report" || true
              else
                echo "WARN gate-deps: the JSON re-scan exited $jrc, so the findings table could not be printed; the plain scan output above lists them." >&2
              fi
              echo "FAIL gate-deps (deps-severity-floor: any): osv-scanner reported at least one advisory and this repo runs ZERO TOLERANCE - every finding blocks, the T2 inventory rows included. Bump or remove each affected dependency, or record a reviewed ignore in osv-scanner.toml." >&2
              exit 1
            fi
            # The JSON pass must reach the same terminal state as the pass above
            # (0 = clean, 1 = findings). Anything else means we could not
            # classify, which is a SCAN error, not a clean tree - fail closed
            # with the same exit-75 semantics used below.
            if [ "$jrc" -ne 0 ] && [ "$jrc" -ne 1 ]; then
              echo "ERROR gate-deps: the JSON re-scan needed to classify these findings exited $jrc - this is NOT a vulnerability verdict. The tree was not fully classified, so the gate blocks rather than passing silently." >&2
              exit 75
            fi
            grc=0
            python3 "${RUNNER_TEMP}/qzp-lean-gate/osv_severity_gate.py" "$json_report" || grc=$?
            if [ "$grc" -eq 0 ]; then
              echo "PASS gate-deps: 0 findings clear the T0 severity floor. Everything osv-scanner reported is listed above as T2 inventory (dev-only, unscored, below CVSS 7.0, or no published fix) - visible, tracked, and deliberately non-blocking."
            elif [ "$grc" -eq 1 ]; then
              echo "FAIL gate-deps: at least one PRODUCTION dependency has a CVSS >= 7.0 advisory WITH a published fix. Every blocking row above names the version to bump to." >&2
              exit 1
            else
              echo "ERROR gate-deps: the severity classifier exited $grc (expected 0 or 1) - the findings could not be classified, so this is NOT a vulnerability verdict and the gate blocks rather than passing silently." >&2
              exit 75
            fi
          elif is_scan_error "$rc"; then
            why='an unexpected scanner failure'
            case "$rc" in
              127) why='the scanner logged an error - commonly a deps.dev / registry resolver outage ("rpc error: code = Unavailable desc = service unavailable")' ;;
              129) why='the OSV.dev API was unreachable (ErrAPIFailed)' ;;
              130) why='the osv-scanner config file was rejected (invalid config)' ;;
            esac
            echo "ERROR gate-deps: osv-scanner could not complete the scan (exit $rc) - this is NOT a vulnerability finding." >&2
            echo "ERROR gate-deps: exit $rc means $why." >&2
            echo "ERROR gate-deps: attempts made ${attempt}/${max_attempts}. The dependency tree was NOT fully scanned, so this gate cannot certify it clean; it blocks rather than passing silently. Re-run the job once upstream recovers." >&2
            exit 75
          else
            echo "ERROR gate-deps: osv-scanner exited $rc, which is not a documented exit code for the pinned 2.3.8 (0/1/127/128/129/130) - treating it as a scan failure, NOT a vulnerability finding." >&2
            exit 75
          fi

      # ── Charter ↔ active-gate consistency (fails if gate set != 6-charter) ─
      - name: charter-check
        id: charter
        if: steps.detect.outputs.charter == 'true'
        run: bash .quality/charter_check.sh

      # ── Per-gate summary (always) ─────────────────────────────────────────
      # One table in the run summary saying which gate RAN, which was SKIPPED
      # because its language is absent, and which NEVER RAN because an earlier
      # step failed. Steps stop at the first failure, so without this table a
      # red run hides every gate after the failing one, and a skipped gate is
      # indistinguishable from a passed one in the step list.
      - name: Lean-gate summary
        if: always()
        shell: bash
        env:
          DETECT_OUTCOME: ${{ steps.detect.outcome }}
          PY: ${{ steps.detect.outputs.python }}
          TS: ${{ steps.detect.outputs.ts }}
          JSTS: ${{ steps.detect.outputs.jsts }}
          GO: ${{ steps.detect.outputs.go }}
          CPP: ${{ steps.detect.outputs.cpp }}
          CHARTER: ${{ steps.detect.outputs.charter }}
          LINT_JSTS: ${{ steps.lint_jsts.outcome }}
          LINT_PY: ${{ steps.lint_py.outcome }}
          TYPES_TSC: ${{ steps.types_tsc.outcome }}
          TYPES_PY: ${{ steps.types_py.outcome }}
          COV_PY: ${{ steps.cov_py.outcome }}
          COV_JSTS: ${{ steps.cov_jsts.outcome }}
          COV_COMPILED: ${{ steps.cov_compiled.outcome }}
          SAST: ${{ steps.sast.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
          DEPS: ${{ steps.deps.outcome }}
          CHARTER_CHECK: ${{ steps.charter.outcome }}
          COV_PY_RESULT: ${{ steps.cov_py.outputs.result }}
          COV_JSTS_RESULT: ${{ steps.cov_jsts.outputs.result }}
          COV_COMPILED_RESULT: ${{ steps.cov_compiled.outputs.result }}
          DEPS_RESULT: ${{ steps.deps.outputs.result }}
        run: |
          set -uo pipefail
          compiled=false
          if [ "$GO" = "true" ] || [ "$CPP" = "true" ]; then compiled=true; fi
          # $1 gate, $2 step, $3 outcome, $4 does the gate apply here, $5 why
          # not, $6 the step's own result output (how a successful step says
          # it skipped measurement internally rather than passing it)
          row() {
            local result
            case "$3:${6:-}" in
              success:no-test-surface) result="skipped - source present but zero test files (no test surface)" ;;
              success:nothing-to-scan) result="ran - nothing to scan (osv-scanner found no package sources)" ;;
              success:*) result="ran - passed" ;;
              failure:*) result="ran - **FAILED**" ;;
              cancelled:*) result="cancelled" ;;
              *)
                if [ "$DETECT_OUTCOME" != "success" ]; then
                  result="NOT RUN - language detection did not complete"
                elif [ "$4" = "true" ]; then
                  result="NOT RUN - an earlier step failed"
                else
                  result="skipped - $5"
                fi
                ;;
            esac
            printf '| %s | %s | %s |\n' "$1" "$2" "$result"
          }
          {
            echo "## Lean 6-gate summary"
            echo ""
            echo "| gate | step | result |"
            echo "| --- | --- | --- |"
            row "1 lint+format" "oxlint + biome (JS/TS)" "$LINT_JSTS" "$JSTS" "no JS/TS source"
            row "1 lint+format" "ruff (Python)" "$LINT_PY" "$PY" "no Python source"
            row "2 types" "tsc" "$TYPES_TSC" "$TS" "no TypeScript source"
            row "2 types" "basedpyright" "$TYPES_PY" "$PY" "no Python source"
            row "3 tests+coverage" "Python" "$COV_PY" "$PY" "no Python source" "$COV_PY_RESULT"
            row "3 tests+coverage" "JS/TS" "$COV_JSTS" "$JSTS" "no JS/TS source" "$COV_JSTS_RESULT"
            row "3 tests+coverage" "Go / C++" "$COV_COMPILED" "$compiled" "no Go or C++ source" "$COV_COMPILED_RESULT"
            row "4 SAST" "opengrep" "$SAST" "true" "-"
            row "5 secrets" "gitleaks" "$SECRETS" "true" "-"
            row "6 deps" "osv-scanner" "$DEPS" "true" "-" "$DEPS_RESULT"
            row "charter" "charter-check" "$CHARTER_CHECK" "$CHARTER" "no .quality/charter.yml"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
