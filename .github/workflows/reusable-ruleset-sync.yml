name: Reusable Ruleset Sync

permissions: {}

on:
  workflow_call:
    inputs:
      repo_slug:
        type: string
        required: true
      platform_repository:
        type: string
        required: false
        default: Prekzursil/quality-zero-platform
        description: "Deprecated and ignored. The platform is checked out at this workflow file's own commit (job.workflow_repository / job.workflow_sha), so a caller can no longer pick, or drift from, the scripts it runs. Still declared so existing callers that pass it keep working."
      platform_ref:
        type: string
        required: false
        default: main
        description: "Deprecated and ignored. The platform is checked out at this workflow file's own commit (job.workflow_repository / job.workflow_sha), so a caller can no longer pick, or drift from, the scripts it runs. Still declared so existing callers that pass it keep working."

jobs:
  ruleset-sync:
    name: Ruleset Sync Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the platform at this workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: platform
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install platform dependencies
        run: python -m pip install -r platform/requirements-dev.txt
      - name: Generate expected ruleset payload
        env:
          REPO_SLUG: ${{ inputs.repo_slug }}
        run: |
          python platform/scripts/quality/generate_ruleset_payload.py \
            --repo-slug "$REPO_SLUG" \
            --output-dir "$RUNNER_TEMP/generated"
      # Both comparisons run in scripts/quality/ruleset_live_drift.py (unit-
      # tested to 100%) instead of inline Python. The old live step read
      # `rules` from the ruleset LIST endpoint, which returns none, and
      # assumed the required-checks rule was always rules[1]. Exit codes:
      # 0 in sync, 1 drift, 2 the live state could not be established.
      - name: Compare the committed and the LIVE ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ inputs.repo_slug }}
          GENERATED_DIR: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          shopt -s nullglob
          generated=("$GENERATED_DIR"/*.json)
          if [ "${#generated[@]}" -ne 1 ]; then
            echo "ERROR ruleset-sync: expected exactly one generated payload, found ${#generated[@]}." >&2
            exit 2
          fi
          committed="platform/generated/rulesets/$(basename "${generated[0]}")"
          if [ ! -f "$committed" ]; then
            echo "ERROR ruleset-sync: missing committed ruleset payload: $committed" >&2
            exit 2
          fi
          python platform/scripts/quality/ruleset_live_drift.py \
            --expected "${generated[0]}" \
            --committed "$committed" \
            --repo-slug "$REPO_SLUG"
