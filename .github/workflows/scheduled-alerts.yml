name: Scheduled Alerts

# QZP v2 §8 scheduled alert dispatch. Runs every 6 hours and on
# manual dispatch: gathers fleet state, runs every detector in
# ``scripts.quality.alert_triggers``, and opens / reuses an issue
# for each trigger via ``scripts.quality.alerts.open_alert_issue``.
# Per-event only — no digest.
#
# Fleet state sources:
#   - LIVE (scripts/quality/fleet_state.py; a failed read fails the run):
#     open break-glass follow-up issues -> bypass-stale;
#     open drift-sync PRs across the fleet -> drift-stuck.
#   - files nothing produces yet (absent -> the summary says NOT evaluated):
#     quality-rollup/coverage-trend.json -> coverage regression detectors;
#     audit/bump-staging-results.jsonl -> fleet-bump wave outcome.
# plus the platform's OWN default-branch workflow runs (gh run list): a
# workflow whose last 3 completed runs all failed opens an
# alert:workflow-failing issue, closed again when the workflow next succeeds.
#
# Scheduled runs are LIVE. They used to default to dry-run too, so 470+
# "green" runs never opened a single issue while Codex Fleet Wave and the CVE
# sweep failed every night. In dry-run mode (still the default on a manual
# workflow_dispatch) the dispatcher computes which issues WOULD open or close
# but never writes through ``gh``.

permissions: {}

# checkov:skip=CKV_GHA_7:dry_run is a control-plane flag (computes triggers without firing gh CLI), not a build-output mutator
on:
  schedule:
    # Every 6 hours, offset by 17 minutes to avoid the top-of-hour
    # spike when every scheduled workflow in the fleet fires at once.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        required: false
        default: true
        description: "When true, compute triggers but skip gh issue calls."

concurrency:
  group: scheduled-alerts
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # gh run list: the platform's own workflow history
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install platform dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Gather fleet state + dispatch triggers
        env:
          # Scheduled runs are live; a manual dispatch takes its input
          # (which defaults to a dry run).
          QZ_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          from pathlib import Path
          from scripts.quality import alert_dispatch, alerts, fleet_state

          PLATFORM = "Prekzursil/quality-zero-platform"
          dry_run = os.environ.get("QZ_DRY_RUN", "true").strip().lower() == "true"

          def _safe_jsonl(path_str: str) -> list:
              path = Path(path_str)
              if not path.is_file():
                  return []
              rows = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  rec = json.loads(line)
                  if isinstance(rec, dict):
                      rows.append(rec)
              return rows

          def _safe_json(path_str: str) -> dict:
              path = Path(path_str)
              if not path.is_file():
                  return {}
              parsed = json.loads(path.read_text(encoding="utf-8"))
              return parsed if isinstance(parsed, dict) else {}

          # Files the remaining fleet detectors read. Nothing produces them
          # yet, so the summary says which detectors had NO input and were
          # therefore not evaluated: a green run must not imply they were.
          SOURCES = {
              "quality-rollup/coverage-trend.json": "regression / deadline / escalation / flag",
              "audit/bump-staging-results.jsonl": "fleet-bump-fail",
          }
          missing = {path: detectors for path, detectors in SOURCES.items() if not Path(path).is_file()}
          cov = _safe_json("quality-rollup/coverage-trend.json")
          staging = _safe_jsonl("audit/bump-staging-results.jsonl")
          # LIVE sources: read now, never from a file nothing writes. A failed
          # read raises and fails the run - never a silent all-clear.
          bypass_issues = fleet_state.bypass_followups(PLATFORM)
          drift_prs = fleet_state.drift_sync_prs(PLATFORM.split("/", 1)[0])

          active = alert_dispatch.fetch_active_workflows(PLATFORM)
          state = {
              "today": dt.date.today(),
              "now": dt.datetime.now(tz=dt.timezone.utc),
              "profiles": cov.get("repos", []),
              "bypass_issues": bypass_issues,
              "drift_prs": drift_prs,
              "staging_results": staging,
              "recipe_name": cov.get("active_bump_recipe", ""),
              # QZP's own workflows: newest-first conclusions per workflow.
              "workflow_runs": alert_dispatch.workflow_conclusions(
                  alert_dispatch.fetch_workflow_runs(PLATFORM, workflows=active)
              ),
          }
          if not dry_run:
              # gh issue create rejects a label the repo lacks.
              alerts.ensure_alert_labels(PLATFORM)
          triggers = alert_dispatch.build_triggers_from_fleet_state(state)
          results = alert_dispatch.dispatch_detected_triggers(
              platform_slug=PLATFORM,
              triggers=triggers,
              dry_run=dry_run,
          )
          closed = alert_dispatch.close_recovered_workflow_alerts(
              platform_slug=PLATFORM,
              workflow_runs=state["workflow_runs"],
              active_workflows={str(workflow.get("name", "")) for workflow in active},
              dry_run=dry_run,
          )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Scheduled Alerts Dispatch\n\n")
                  fh.write(f"- Dry-run: `{dry_run}`\n")
                  fh.write(f"- Triggers: {len(triggers)}\n")
                  fh.write(f"- Issues opened/reused: {len(results)}\n")
                  fh.write(f"- QZP workflows watched: {len(state['workflow_runs'])}\n")
                  fh.write(f"- Open break-glass follow-ups (live): {len(bypass_issues)}\n")
                  fh.write(f"- Open drift-sync PRs (live): {len(drift_prs)}\n")
                  for path, detectors in missing.items():
                      fh.write(f"- NOT evaluated ({detectors}): no `{path}` - nothing produces it yet\n")
                  fh.write(f"- Recovered workflow alerts closed: {sum(1 for c in closed if c.get('closed'))}\n")
                  per_type = {}
                  for t in triggers:
                      key = t.alert_type.label
                      per_type[key] = per_type.get(key, 0) + 1
                  if per_type:
                      fh.write("- By type:\n")
                      for label, count in sorted(per_type.items()):
                          fh.write(f"  - `{label}`: {count}\n")

          sys.stdout.write(
              f"scheduled-alerts: {len(triggers)} triggers, "
              f"dry_run={dry_run}\n",
          )
          PY
