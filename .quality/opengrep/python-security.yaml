# Curated Python security rules (subset of p/python + p/r2c-security-audit).
# opengrep/semgrep compatible. See README.md.
rules:
  - id: python-exec-use
    languages: [python]
    severity: ERROR
    message: >-
      Use of exec() detected. Executing dynamically-built code is dangerous and
      can lead to remote code execution. Avoid exec; use explicit dispatch.
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
    patterns:
      - pattern: exec(...)

  - id: python-eval-use
    languages: [python]
    severity: ERROR
    message: >-
      Use of eval() detected. eval on untrusted input enables code injection.
      Use ast.literal_eval or an explicit parser instead.
    metadata:
      category: security
      cwe: "CWE-95"
    patterns:
      - pattern: eval(...)

  - id: python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess called with shell=True. If any argument is attacker-influenced
      this allows command injection. Pass an argument list and shell=False.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
    patterns:
      - pattern-either:
          - pattern: subprocess.$F(..., shell=True, ...)
          - pattern: subprocess.$F(..., shell=$X, ...)
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern: "True"

  - id: python-os-system
    languages: [python]
    severity: ERROR
    message: >-
      os.system() invokes a shell and is prone to command injection. Use
      subprocess with an argument list instead.
    metadata:
      category: security
      cwe: "CWE-78"
    patterns:
      - pattern: os.system(...)

  - id: python-yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: >-
      yaml.load without SafeLoader can construct arbitrary Python objects.
      Use yaml.safe_load() or Loader=yaml.SafeLoader.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
    patterns:
      - pattern: yaml.load($X)

  - id: python-pickle-loads
    languages: [python]
    severity: ERROR
    message: >-
      pickle deserialization of untrusted data enables arbitrary code execution.
      Use a safe format (JSON) for untrusted input.
    metadata:
      category: security
      cwe: "CWE-502"
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)

  - id: python-weak-hash-md5-sha1
    languages: [python]
    severity: ERROR
    message: >-
      Weak hash algorithm (md5/sha1) used. For security contexts use sha256+.
      If non-security (e.g. content hashing), pass usedforsecurity=False.
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
    patterns:
      - pattern-either:
          - pattern: hashlib.md5($X)
          - pattern: hashlib.sha1($X)

  - id: python-requests-verify-false
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificate verification disabled (verify=False). This permits
      man-in-the-middle attacks. Keep verification enabled.
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
    patterns:
      - pattern: requests.$F(..., verify=False, ...)

  - id: python-jwt-decode-verify-false
    languages: [python]
    severity: ERROR
    message: >-
      JWT decoded with signature verification disabled. Always verify signatures
      on tokens you did not just mint.
    metadata:
      category: security
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
    patterns:
      - pattern: jwt.decode(..., verify=False, ...)

  # ── DATAFLOW rule. Every rule above matches SYNTAX, which means the same
  # vulnerability written across two statements escapes it. Measured on the
  # pinned CI engine (opengrep v1.22.0) with the fleet's real Go ruleset:
  # `db.Query(fmt.Sprintf(...))` fires, while `q := fmt.Sprintf(...)` followed
  # by `db.Query(q)` — arguably the more idiomatic form — escapes ALL FOUR
  # curated rules. The file WAS scanned (`paths.scanned` contains it), so that
  # is a rule-precision gap, not a targeting artifact: it makes a clean zero
  # from a syntax-only set much weaker evidence than it looks.
  #
  # `mode: taint` closes it by following the value instead of the shape.
  # Both-states corpus, all on opengrep v1.22.0 (BAD must fire, GOOD must not):
  #   BAD   f-string    -> local -> cur.execute(q)          FIRES
  #   BAD   %-format    -> local -> cur.execute(q)          FIRES
  #   BAD   .format()   -> local -> cur.executemany(q)      FIRES
  #   BAD   f-string -> local -> local -> cur.execute(q)    FIRES  (two hops)
  #   GOOD  cur.execute("... ?", (name,))  (bound params)   silent
  #   GOOD  f"SELECT count(*) FROM users"  (no interpolation) silent
  #   GOOD  f"hello {name}" -> print()     (no SQL sink)    silent
  - id: python-sql-format-taint
    languages: [python]
    severity: ERROR
    mode: taint
    message: >-
      Possible SQL injection: an interpolated/concatenated string flows into a
      SQL execution API. This rule follows DATAFLOW, so it also catches the
      two-statement form (build the query into a local, then execute it) that a
      syntax-only pattern cannot see. Use bound parameters —
      cursor.execute(sql, params) — instead.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
    pattern-sources:
      - pattern-either:
          # An f-string is a source only when it actually INTERPOLATES; the
          # `{$X}` is load-bearing. Note a `pattern-not: f"..."` guard here
          # LOOKS like it excludes only constant f-strings, but in fact negates
          # EVERY f-string and silently drops both f-string cases — measured
          # against the corpus above, which is how it was caught.
          - pattern: f"...{$X}..."
          - pattern: "$FMT % $ARGS"
          - pattern: $FMT.format(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($Q, ...)
              - pattern: $CUR.executemany($Q, ...)
              - pattern: $CUR.executescript($Q, ...)
              - pattern: sqlalchemy.text($Q)
              - pattern: text($Q)
          - focus-metavariable: $Q
