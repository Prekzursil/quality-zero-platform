# Single source of truth for the lean 6-gate tool pins.
#
# These are the EXACT versions the reusable-quality.yml lanes run in CI, and
# the versions scripts/quality/preflight.sh reproduces locally in a consumer
# repo. Before this file existed each pin lived only as a literal inside
# .github/workflows/reusable-quality.yml (some of them in three places).
#
# When bumping a pin:
#   1. edit THIS file;
#   2. update the matching literal in .github/workflows/reusable-quality.yml.
#      The workflow carries LITERALS on purpose: a caller pins the workflow by
#      commit SHA, and a value read from this repo's main at run time would
#      change under that pin. tests/test_workflow_contracts.py and the weekly
#      fleet-health pin-drift check fail on any mismatch;
#   3. update docs/lean-gate/pre-commit-config.template.yaml to match;
#   4. re-run scripts/quality/preflight.sh on a consumer repo to confirm
#      local/CI parity before merging the bump.
#
# Consumers: do NOT pin tools to different versions locally. A finding that
# only reproduces on a different tool version is not the gate's finding.
version: 1
pins:
  # gate 1 (py): ruff check + ruff format --check
  ruff: "0.15.17"
  # gate 2 (py): basedpyright (standard typeCheckingMode unless caller config)
  basedpyright: "1.39.8"
  # gate 3 (py): the measuring tools. pytest + pytest-cov when the caller's
  # config mentions pytest, otherwise coverage.py over unittest (--branch).
  pytest: "9.1.1"
  pytest-cov: "7.1.0"
  coverage: "7.16.2"
  # gate 1 (jsts): oxlint --deny-warnings
  oxlint: "1.69.0"
  # gate 1 (jsts): biome ci --formatter-enabled (formatter-only)
  biome: "2.5.15"
  # gate 4: opengrep scan --config .quality/opengrep
  opengrep: "v1.22.0"
  # gate 5: gitleaks detect --redact
  gitleaks: "8.30.1"
  # gate 6: osv-scanner scan source
  osv-scanner: "v2.3.8"

# SHA-256 of the exact release ASSET each pinned download fetches (GitHub's
# published release-asset digests). The CI workflows verify the linux x86-64
# assets with `sha256sum -c`; scripts/quality/preflight_tools.sh verifies the
# asset for the local platform. Nothing is installed on a mismatch. When
# bumping a pin above, replace ALL its digests here (and the linux x86-64 one in
# the workflows): tests/test_tool_download_integrity.py,
# tests/test_preflight_tools.py and the fleet-health pin-drift check fail on
# any mismatch.
