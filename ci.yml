name: Python Tooling CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: python-tooling-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run tests with coverage
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
python3 -m pip install -r requirements-dev.txt coverage
coverage run --branch -m unittest discover -s tests -p 'test_*.py'
coverage xml -o coverage/platform-coverage.xml
mkdir -p coverage
# scripts/provider_ui/*.mjs has its own Node test suite; emit lcov for Sonar
# (sonar.javascript.lcov.reportPaths) + Codecov 'provider_ui' flag so the
# 4 .mjs files stop sitting at 0% coverage in the dashboards. The
# --test-coverage-exclude flag requires Node ≥22.10 (set
# via coverage.setup.node above) — it keeps test files out of the lcov
# source list so totals match the source-only branch coverage gate.
node --test --experimental-test-coverage \
  --test-coverage-exclude='**/*.test.mjs' \
  --test-reporter=lcov \
  --test-reporter-destination=coverage/provider_ui-lcov.info \
  scripts/provider_ui/*.test.mjs || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: python -m pip install --upgrade pip && pip install ruff lizard
      - name: Ruff lint
        run: ruff check scripts/ tests/
      - name: Lizard cyclomatic complexity
        run: lizard scripts/ -C 15
