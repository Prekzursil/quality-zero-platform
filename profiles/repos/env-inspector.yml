slug: Prekzursil/env-inspector
version: 2
stack: python-desktop
mode:
  phase: absolute
scanners: {}
overrides: []
verify_command: make verify
issue_policy:
  mode: zero
  pr_behavior: absolute
  main_behavior: absolute
coverage:
  command: "mkdir -p coverage\nmkdir -p .tmp\nexport TMPDIR=\"$PWD/.tmp\"\npython\
    \ -m pip install --upgrade pip\nif [ -f requirements.txt ]; then python -m pip\
    \ install -r requirements.txt; fi\n# ``defusedxml`` is the XXE-safe XML parser\
    \ used by\n# ``scripts/cobertura_to_sonar_generic.py`` (Semgrep\n# ``python.lang.security.use-defused-xmltree``).\
    \  Tests for the\n# converter import it; install here so pytest collection\n#\
    \ doesn't fail with ModuleNotFoundError.\npython -m pip install pytest pytest-cov\
    \ defusedxml\n# ``--cov=.`` (repo root) so coverage.xml has a single\n# ``<source>``\
    \ element. ``.coveragerc`` controls scope via\n# ``omit`` and ``[report] exclude_lines``.\
    \ Per-package style produced\n# multiple ``<source>`` roots Sonar couldn't disambiguate.\n\
    python -m pytest -q -s --cov=. --cov-branch \\\n  --cov-report=xml:coverage/python-coverage.xml\n\
    # Mirror the cobertura XML to ``coverage.xml`` at the repo root so\n# the converter\
    \ + Sonar's reportPaths defaults find it.\ncp coverage/python-coverage.xml coverage.xml\n\
    if [ -f scripts/cobertura_to_sonar_generic.py ]; then\n  python scripts/cobertura_to_sonar_generic.py\
    \ \\\n    --in coverage.xml \\\n    --out coverage-sonar.xml\nfi\n"
  inputs:
  - format: xml
    name: python
    path: coverage/python-coverage.xml
    flag: python
  require_sources:
  - env_inspector.py
  - env_inspector_core/
  - env_inspector_gui/
  min_percent: 100.0
trigger:
  mode: pr-focused
  pr_head_sha: true
vendors:
  sonar:
    project_key: Prekzursil_env-inspector
codeql:
  languages:
  - actions
  - python
dependabot:
  updates: []
# LEAN CONTRACT (migrated 2026-10-24). The SaaS-era set this profile used to
# require (scanner-matrix / Codecov / Sonar / Codacy / Semgrep / Sentry / QLTY /
# DeepSource contexts) is emitted by nothing any more, so the generated ruleset
# required 13-19 checks that could never report and would have blocked every
# pull request if applied. Required = what the repo actually reports on a pull
# request (re-measured 2026-10-24 against its live rulesets and branch
# protection); the code_scanning merge protection comes from the common stack.
#   quality / quality - the lean 6-gate caller (reusable-quality.yml)
#   CodeQL            - the code-scanning aggregate
required_contexts_mode: replace
required_contexts:
  always:
  - quality / quality
  - CodeQL
  pull_request_only: []
  target:
  - quality / quality
  - CodeQL
