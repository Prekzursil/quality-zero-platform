slug: Prekzursil/event-link
version: 2
stack: fullstack-web
mode:
  phase: ratchet
  ratchet:
    baseline: {}
    target_date: ''
    escalation_date: ''
    on_escalation: absolute
scanners:
  deepsource_visible:
    severity: block
overrides: []
verify_command: bash scripts/verify
issue_policy:
  mode: ratchet
  pr_behavior: introduced_only
  main_behavior: absolute
enabled_scanners:
  deepsource_visible: true
coverage:
  command: 'bash scripts/verify

    '
  inputs:
  - format: xml
    name: backend
    path: backend/coverage.xml
    flag: backend
  - format: xml
    name: frontend
    path: ui/coverage/cobertura-coverage.xml
    flag: frontend
  min_percent: 100.0
  branch_min_percent: 100.0
vendors:
  sonar:
    project_key: Prekzursil_event-link
codeql:
  languages:
  - actions
  - javascript-typescript
  - python
dependabot:
  updates:
  - ecosystem: pip
    directory: /backend
  - ecosystem: npm
    directory: /ui
# LEAN CONTRACT (migrated 2026-10-24). The SaaS-era set this profile used to
# require (scanner-matrix / Codecov / Sonar / Codacy / Semgrep / Sentry / QLTY /
# DeepSource contexts) is emitted by nothing any more, so the generated ruleset
# required 13-19 checks that could never report and would have blocked every
# pull request if applied. Required = what the repo actually reports on a pull
# request (re-measured 2026-10-24 against its live rulesets and branch
# protection); the code_scanning merge protection comes from the common stack.
#   quality / quality - the lean 6-gate caller (reusable-quality.yml)
#   CodeQL            - the code-scanning aggregate
required_contexts_mode: replace
required_contexts:
  always:
  - quality / quality
  - CodeQL
  pull_request_only: []
  target:
  - quality / quality
  - CodeQL
