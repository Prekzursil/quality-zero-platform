slug: Prekzursil/momentstudio
version: 2
stack: fullstack-web
mode:
  phase: absolute
scanners: {}
overrides: []
verify_command: make verify
required_secrets:
- CHROMATIC_PROJECT_TOKEN
- APPLITOOLS_API_KEY
coverage:
  command: 'python -m pip install --upgrade pip

    python -m pip install -r backend/requirements.txt coverage pytest ruff mypy

    npm --prefix frontend ci

    make coverage

    '
  inputs:
  - format: xml
    name: backend
    path: backend/coverage.xml
    flag: backend
  - format: lcov
    name: frontend
    path: frontend/coverage/lcov.info
    flag: frontend
visual_pair_required: true
visual_lane:
  kind: web
providers:
  chromatic:
    status_context: Chromatic Playwright
    project_name: momentstudio
    token_secret_parts:
    - CHROMATIC
    - PROJECT
    - TOKEN
    local_env_var_parts:
    - CHROMATIC
    - PROJECT
    - TOKEN
    - MOMENTSTUDIO
  applitools:
    status_context: Applitools Visual
    project_name: momentstudio
  sonar:
    project_key_parts:
    - Prekzursil
    - AdrianaArt
visual_regression:
  chromatic:
    enabled: true
    project_token_secret: CHROMATIC_PROJECT_TOKEN  # skipcq: SCT-A000
    storybook_build_script: npm run build-storybook
    storybook_dir: storybook-static
  applitools:
    enabled: true
    api_key_secret: APPLITOOLS_API_KEY  # skipcq: SCT-A000
    batch_name_strategy: branch-sha
    eyes_config_path: applitools.config.js
codeql:
  languages:
  - actions
  - javascript-typescript
  - python
dependabot:
  updates:
  - ecosystem: pip
    directory: /backend
  - ecosystem: npm
    directory: /frontend
# LEAN CONTRACT (migrated 2026-10-24). The SaaS-era set this profile used to
# require (scanner-matrix / Codecov / Sonar / Codacy / Semgrep / Sentry / QLTY /
# DeepSource contexts) is emitted by nothing any more, so the generated ruleset
# required 13-19 checks that could never report and would have blocked every
# pull request if applied. Required = what the repo actually reports on a pull
# request (re-measured 2026-10-24 against its live rulesets and branch
# protection); the code_scanning merge protection comes from the common stack.
#   quality / quality - the lean 6-gate caller (reusable-quality.yml); the
#                       only check its branch protection requires today
#   CodeQL            - the code-scanning aggregate (reusable-codeql caller)
# The `Chromatic Playwright` / `Applitools Visual` contexts are dropped: both
# visual vendors were retired with the SaaS lane and report nothing.
required_contexts_mode: replace
required_contexts:
  always:
  - quality / quality
  - CodeQL
  pull_request_only: []
  target:
  - quality / quality
  - CodeQL
