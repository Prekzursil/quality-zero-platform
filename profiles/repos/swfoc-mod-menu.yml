slug: Prekzursil/SWFOC-Mod-Menu
version: 2
stack: dotnet-wpf
mode:
  phase: absolute
scanners: {}
overrides: []
verify_command: dotnet test tests/SwfocTrainer.Tests/SwfocTrainer.Tests.csproj -c
  Release --no-build --filter "FullyQualifiedName!~SwfocTrainer.Tests.Profiles.Live&FullyQualifiedName!~RuntimeAttachSmokeTests"
coverage:
  runner: windows-latest
  command_shell: pwsh
  command: "pwsh -ExecutionPolicy Bypass -File ./tools/quality/collect-dotnet-coverage.ps1\
    \ -Configuration Release -DeterministicOnly\n$candidates = @(\n  (Join-Path (Get-Location)\
    \ 'TestResults/coverage/cobertura.xml'),\n  (Join-Path (Get-Location) 'tests/SwfocTrainer.Tests/TestResults/coverage.cobertura.xml'),\n\
    \  (Join-Path (Get-Location) 'TestResults/coverage.cobertura.xml')\n)\n$resolved\
    \ = $candidates | Where-Object { Test-Path -Path $_ } | Select-Object -First 1\n\
    if (-not $resolved) {\n  throw \"Coverage report not found. Checked: $($candidates\
    \ -join '; ')\"\n}\nWrite-Host \"Using coverage report: $resolved\"\n"
  inputs:
  - format: xml
    name: dotnet
    path: TestResults/coverage/cobertura.xml
    flag: dotnet
  assert_mode:
    default: enforce
    pull_request: non_regression
  evidence_note: PRs enforce non-regression against the last successful protected-branch
    baseline.
visual_pair_required: true
visual_lane:
  kind: desktop-adapter
trigger:
  mode: standard
  pr_head_sha: true
legacy_policy_checks:
- code/snyk
vendors:
  sonar:
    project_key_parts:
    - Prekzursil
    - SWFOC-Mod-Menu
codeql:
  runner: windows-latest
  languages:
  - actions
  - csharp
  - javascript-typescript
dependabot:
  updates:
  - ecosystem: nuget
    directory: /
# LEAN CONTRACT (migrated 2026-10-24). The SaaS-era set this profile used to
# require (scanner-matrix / Codecov / Sonar / Codacy / Semgrep / Sentry / QLTY /
# DeepSource contexts) is emitted by nothing any more, so the generated ruleset
# required 13-19 checks that could never report and would have blocked every
# pull request if applied. Required = what the repo actually reports on a pull
# request (re-measured 2026-10-24 against its live rulesets and branch
# protection); the code_scanning merge protection comes from the common stack.
#   quality / quality - the lean 6-gate caller (reusable-quality.yml)
#   CodeQL            - the code-scanning aggregate
required_contexts_mode: replace
required_contexts:
  always:
  - quality / quality
  - CodeQL
  pull_request_only: []
  target:
  - quality / quality
  - CodeQL
