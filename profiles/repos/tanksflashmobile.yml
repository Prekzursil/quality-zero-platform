slug: Prekzursil/TanksFlashMobile
version: 2
stack: node-frontend
mode:
  phase: absolute
scanners: {}
overrides: []
verify_command: make verify
required_secrets:
- CHROMATIC_PROJECT_TOKEN
- APPLITOOLS_API_KEY
coverage:
  command: 'npm ci

    npm --prefix apps/web ci

    npm --prefix apps/web test -- --coverage --watch=false

    '
  inputs:
  - format: lcov
    name: web
    path: apps/web/coverage/lcov.info
    flag: web
visual_pair_required: true
visual_lane:
  kind: web
providers:
  chromatic:
    status_context: Chromatic Playwright
    project_name: TanksFlashMobile
    token_secret_parts:
    - CHROMATIC
    - PROJECT
    - TOKEN
    local_env_var_parts:
    - CHROMATIC
    - PROJECT
    - TOKEN
    - TANKSFLASHMOBILE
  applitools:
    status_context: Applitools Visual
    project_name: TanksFlashMobile
vendors:
  sonar:
    project_key_parts:
    - Prekzursil
    - TanksFlashMobile
codeql:
  languages:
  - actions
  - javascript-typescript
  - java-kotlin
dependabot:
  updates:
  - ecosystem: npm
    directory: /
  - ecosystem: npm
    directory: /apps/web
  - ecosystem: npm
    directory: /apps/desktop
  - ecosystem: npm
    directory: /apps/remake-web
  - ecosystem: npm
    directory: /apps/web/public/ruffle
  - ecosystem: gradle
    directory: /android
# LEAN CONTRACT (migrated 2026-10-24). The SaaS-era set this profile used to
# require (scanner-matrix / Codecov / Sonar / Codacy / Semgrep / Sentry / QLTY /
# DeepSource contexts) is emitted by nothing any more, so the generated ruleset
# required 13-19 checks that could never report and would have blocked every
# pull request if applied. Required = what the repo actually reports on a pull
# request (re-measured 2026-10-24 against its live rulesets and branch
# protection); the code_scanning merge protection comes from the common stack.
#   quality / quality - the lean 6-gate caller (reusable-quality.yml)
#   CodeQL            - the code-scanning aggregate
# The live (disabled) ruleset's `Chromatic Playwright` / `Applitools Visual`
# are dropped: both visual vendors were retired with the SaaS lane and report
# nothing, so requiring them would block every pull request.
required_contexts_mode: replace
required_contexts:
  always:
  - quality / quality
  - CodeQL
  pull_request_only: []
  target:
  - quality / quality
  - CodeQL
